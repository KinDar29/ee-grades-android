<script>
/* =============================================================================
   Electrical Engineering — Grades Portal · browser application
   ========================================================================== */

var S = {
  token: '',
  profile: null,
  portal: null,
  admin: null,
  tab: 'classes',
  section: null,
  dirty: {},
  studentPage: 1,
  studentQuery: '',
  loginRole: 'student'
};

/* ------------------------------- transport ------------------------------- */

function call(action, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (raw) {
        var parsed;
        try { parsed = JSON.parse(raw); }
        catch (e) { reject(new Error('The server sent something unexpected. Please reload the page.')); return; }
        if (parsed.ok) { resolve(parsed.data); return; }
        if (parsed.authRequired) { forceSignOut(parsed.error); }
        if (parsed.mustChangePassword && !document.querySelector('#pwSave')) { promptPasswordChange(true); }
        reject(new Error(parsed.error || 'Something went wrong.'));
      })
      .withFailureHandler(function (err) {
        reject(new Error((err && err.message) || 'Could not reach the server. Check your connection.'));
      })
      .api({ action: action, payload: payload || {}, token: S.token || '' });
  });
}

/* -------------------------------- storage -------------------------------- */

function saveToken(t) {
  S.token = t || '';
  try { t ? localStorage.setItem('care.token', t) : localStorage.removeItem('care.token'); }
  catch (e) { /* private browsing */ }
}
function loadToken() {
  try { return localStorage.getItem('care.token') || ''; } catch (e) { return ''; }
}

/* ------------------------------- utilities ------------------------------- */

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmt(n, d) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  return Number(n).toFixed(d === undefined ? 2 : d);
}
function fmtScore(n) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  return (Math.round(Number(n) * 100) / 100).toString();
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

function toast(message, kind) {
  var box = document.createElement('div');
  box.className = 'toast ' + (kind || '');
  box.textContent = message;
  $('#toasts').appendChild(box);
  setTimeout(function () {
    box.style.transition = 'opacity .25s';
    box.style.opacity = '0';
    setTimeout(function () { box.remove(); }, 260);
  }, kind === 'error' ? 6000 : 3400);
}

function busy(button, on, label) {
  if (!button) return;
  if (on) {
    button.dataset.label = button.innerHTML;
    button.disabled = true;
    button.innerHTML = '<span class="spinner"></span> ' + esc(label || 'Working…');
  } else {
    button.disabled = false;
    if (button.dataset.label) button.innerHTML = button.dataset.label;
  }
}

/*
 * Every view binds its own click handlers to #content. Swapping the node
 * instead of just its innerHTML throws those handlers away with it — otherwise
 * they stack up across renders and one click fires the same action twice.
 */
function setContent(html) {
  var old = document.getElementById('content');
  var fresh = document.createElement('div');
  fresh.id = 'content';
  fresh.className = old.className;
  fresh.innerHTML = html;
  old.parentNode.replaceChild(fresh, old);
}
function loading(text) {
  setContent('<div class="loading"><span class="spinner"></span> ' + esc(text || 'Loading…') + '</div>');
}
function empty(title, note, actionHtml) {
  return '<div class="empty"><div class="big">◇</div><h4>' + esc(title) + '</h4>' +
    '<p class="small">' + esc(note || '') + '</p>' + (actionHtml || '') + '</div>';
}

/* --------------------------------- modal --------------------------------- */

var _modalStack = [];

function openModal(opts) {
  var back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML =
    '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
      '<header><h3>' + esc(opts.title) + '</h3><div class="spacer"></div>' +
        (opts.locked ? '' : '<button class="btn ghost icon" data-close="1" aria-label="Close">✕</button>') +
      '</header>' +
      '<div class="body">' + (opts.body || '') + '</div>' +
      (opts.footer === null ? '' : '<footer>' + (opts.footer || '') + '</footer>') +
    '</div>';
  $('#modalRoot').appendChild(back);
  _modalStack.push(back);

  function close() {
    var i = _modalStack.indexOf(back);
    if (i > -1) _modalStack.splice(i, 1);
    back.remove();
  }
  back.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { close(); return; }
    if (e.target === back && !opts.locked) close();
  });
  if (opts.onMount) opts.onMount(back, close);
  var first = back.querySelector('input, select, textarea');
  if (first) setTimeout(function () { first.focus(); }, 40);
  return { root: back, close: close };
}

function confirmDialog(title, message, confirmLabel, danger) {
  return new Promise(function (resolve) {
    var m = openModal({
      title: title,
      body: '<p class="small" style="margin:0">' + esc(message) + '</p>',
      footer: '<button class="btn" data-close="1">Cancel</button>' +
        '<button class="btn ' + (danger ? 'danger' : 'primary') + '" id="cfmYes">' +
        esc(confirmLabel || 'Confirm') + '</button>',
      onMount: function (root, close) {
        root.querySelector('#cfmYes').addEventListener('click', function () { close(); resolve(true); });
        root.addEventListener('click', function (e) {
          if (e.target.closest('[data-close]') || e.target === root) resolve(false);
        });
      }
    });
    void m;
  });
}

/* ================================== BOOT ================================== */

document.addEventListener('DOMContentLoaded', function () {
  bindShell();
  S.token = loadToken();

  try {
    var carried = sessionStorage.getItem('care.msg');
    if (carried) {
      sessionStorage.removeItem('care.msg');
      $('#loginNotice').innerHTML = '<div class="alert warn"><span class="ic">!</span><div>' +
        esc(carried) + '</div></div>';
    }
  } catch (e) { /* storage unavailable */ }

  call('portal', {}).then(function (info) {
    S.portal = info;
    applyBranding(info);
    if (!info.ready) {
      $('#loginNotice').innerHTML =
        '<div class="alert warn"><span class="ic">!</span><div>The database has not been created yet. ' +
        'Open the Apps Script editor and run <b>setUp()</b> once, then reload this page.</div></div>';
      return;
    }
    if (info.contactEmail) {
      $('#loginHelp').innerHTML = 'Trouble signing in? Contact <a href="mailto:' +
        esc(info.contactEmail) + '">' + esc(info.contactEmail) + '</a>';
    }
    if (S.token) resumeSession();
  }).catch(function (err) {
    $('#loginNotice').innerHTML = '<div class="alert error"><span class="ic">!</span><div>' +
      esc(err.message) + '</div></div>';
  });
});

function applyBranding(info) {
  if (!info) return;
  if (info.title) { $('#loginTitle').textContent = info.title; $('#barTitle').textContent = info.title; }
  if (info.subtitle) { $('#loginSubtitle').textContent = info.subtitle; $('#barSubtitle').textContent = info.subtitle; }
}

function resumeSession() {
  call('session', {}).then(function (res) {
    S.profile = res.profile;
    showApp();
    if (res.mustChangePassword) promptPasswordChange(true);
    else route();
  }).catch(function () {
    saveToken('');
  });
}

function bindShell() {
  $('#roleSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-role]');
    if (!b) return;
    S.loginRole = b.dataset.role;
    $$('#roleSwitch button').forEach(function (x) { x.classList.toggle('on', x === b); });
    var admin = S.loginRole === 'admin';
    $('#loginUserLabel').textContent = admin ? 'E-mail address' : 'Student number';
    $('#loginUser').placeholder = admin ? 'you@mmsu.edu.ph' : 'e.g. 21-123456';
    $('#loginUser').type = admin ? 'email' : 'text';
  });

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    doLogin();
  });

  $('#btnSignOut').addEventListener('click', function () {
    saveToken('');
    location.reload();
  });

  $('#btnAccount').addEventListener('click', function () { promptPasswordChange(false); });

  $('#forgotLink').addEventListener('click', function (e) {
    e.preventDefault();
    forgotPasswordModal();
  });

  $('#adminTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    S.tab = b.dataset.tab;
    S.section = null;
    $$('#adminTabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    route();
  });
}

function showApp() {
  $('#view-login').classList.add('hidden');
  $('#view-app').classList.remove('hidden');
  $('#barName').textContent = S.profile.name;
  $('#barRole').textContent = S.profile.role === 'admin'
    ? (S.profile.adminRole || 'Administrator')
    : ('Student · ' + (S.profile.id || ''));
  $('#adminTabs').classList.toggle('hidden', S.profile.role !== 'admin');
}

function forceSignOut(message) {
  saveToken('');
  if (message) try { sessionStorage.setItem('care.msg', message); } catch (e) {}
  setTimeout(function () { location.reload(); }, 400);
}

function doLogin() {
  var btn = $('#loginBtn');
  var user = $('#loginUser').value.trim();
  var pass = $('#loginPass').value;
  $('#loginNotice').innerHTML = '';
  busy(btn, true, 'Signing in…');
  call('login', { role: S.loginRole, username: user, password: pass })
    .then(function (res) {
      saveToken(res.token);
      S.profile = res.profile;
      showApp();
      if (res.mustChangePassword) promptPasswordChange(true);
      else route();
    })
    .catch(function (err) {
      busy(btn, false);
      $('#loginNotice').innerHTML = '<div class="alert error"><span class="ic">!</span><div>' +
        esc(err.message) + '</div></div>';
      $('#loginPass').value = '';
      $('#loginPass').focus();
    });
}

function route() {
  if (!S.profile) return;
  if (S.profile.role === 'admin') renderAdmin();
  else renderStudentHome();
}

/* ============================ FORGOT PASSWORD ============================= */

function forgotPasswordModal() {
  var role = S.loginRole;
  var admin = role === 'admin';
  var label = admin ? 'E-mail address' : 'Student number';
  function alertHtml(kind, text) {
    return '<div class="alert ' + kind + '"><span class="ic">' + (kind === 'error' ? '!' : 'i') +
      '</span><div>' + esc(text) + '</div></div>';
  }

  openModal({
    title: 'Reset your password',
    body:
      '<p class="small" id="fpIntro">Enter your ' + label.toLowerCase() + '. We\'ll e-mail a 6-digit code ' +
        'to the address on file.</p>' +
      '<div class="field"><label for="fpUser">' + label + '</label>' +
        '<input type="' + (admin ? 'email' : 'text') + '" id="fpUser" autocomplete="username" value="' +
        esc($('#loginUser').value.trim()) + '"></div>' +
      '<div id="fpStep2" class="hidden">' +
        '<div class="field"><label for="fpCode">Code from the e-mail</label>' +
          '<input type="text" id="fpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>' +
        '<div class="field"><label for="fpNew">New password</label>' +
          '<input type="password" id="fpNew" autocomplete="new-password">' +
          '<span class="hint">At least 6 characters.</span></div>' +
        '<div class="field"><label for="fpNew2">Repeat new password</label>' +
          '<input type="password" id="fpNew2" autocomplete="new-password"></div>' +
      '</div>' +
      '<div id="fpMsg"></div>',
    footer:
      '<button class="btn" data-close="1">Cancel</button>' +
      '<button class="btn" id="fpHave">I have a code</button>' +
      '<button class="btn primary" id="fpSend">Send code</button>' +
      '<button class="btn primary hidden" id="fpSave">Set new password</button>',
    onMount: function (root, close) {
      var msg = root.querySelector('#fpMsg');
      var user = root.querySelector('#fpUser');

      function showStep2() {
        root.querySelector('#fpStep2').classList.remove('hidden');
        root.querySelector('#fpSave').classList.remove('hidden');
        root.querySelector('#fpSend').classList.add('hidden');
        root.querySelector('#fpHave').classList.add('hidden');
        root.querySelector('#fpIntro').classList.add('hidden');
        root.querySelector('#fpCode').focus();
      }

      root.querySelector('#fpHave').addEventListener('click', function () {
        msg.innerHTML = '';
        showStep2();
      });

      root.querySelector('#fpSend').addEventListener('click', function () {
        var btn = this;
        msg.innerHTML = '';
        busy(btn, true, 'Sending…');
        call('forgotPassword', { role: role, username: user.value.trim() })
          .then(function (res) {
            busy(btn, false);
            msg.innerHTML = alertHtml('info', res.message);
            showStep2();
          })
          .catch(function (err) {
            busy(btn, false);
            msg.innerHTML = alertHtml('error', err.message);
          });
      });

      root.querySelector('#fpSave').addEventListener('click', function () {
        var btn = this;
        var a = root.querySelector('#fpNew').value;
        var b = root.querySelector('#fpNew2').value;
        msg.innerHTML = '';
        if (a !== b) { msg.innerHTML = alertHtml('error', 'The two new passwords do not match.'); return; }
        busy(btn, true, 'Saving…');
        call('resetPassword', {
          role: role,
          username: user.value.trim(),
          code: root.querySelector('#fpCode').value.trim(),
          newPassword: a
        }).then(function () {
          close();
          $('#loginUser').value = user.value.trim();
          $('#loginPass').value = '';
          $('#loginNotice').innerHTML = '<div class="alert ok"><span class="ic">✓</span><div>' +
            'Your password has been changed. Sign in with your new password.</div></div>';
          $('#loginPass').focus();
        }).catch(function (err) {
          busy(btn, false);
          msg.innerHTML = alertHtml('error', err.message);
        });
      });
    }
  });
}

/* ============================ PASSWORD CHANGE ============================= */

function promptPasswordChange(forced) {
  openModal({
    title: forced ? 'Choose your own password' : 'Change password',
    locked: !!forced,
    body:
      (forced
        ? '<div class="alert info"><span class="ic">i</span><div>You are still using the password your ' +
          'instructor set. Please choose one only you know.</div></div>'
        : '') +
      '<div class="field"><label for="pwOld">Current password</label>' +
      '<input type="password" id="pwOld" autocomplete="current-password"></div>' +
      '<div class="field"><label for="pwNew">New password</label>' +
      '<input type="password" id="pwNew" autocomplete="new-password">' +
      '<span class="hint">At least 6 characters.</span></div>' +
      '<div class="field"><label for="pwNew2">Repeat new password</label>' +
      '<input type="password" id="pwNew2" autocomplete="new-password"></div>' +
      '<div id="pwMsg"></div>',
    footer:
      (forced ? '' : '<button class="btn" data-close="1">Cancel</button>') +
      '<button class="btn primary" id="pwSave">Save password</button>',
    onMount: function (root, close) {
      root.querySelector('#pwSave').addEventListener('click', function () {
        var btn = this;
        var oldPw = root.querySelector('#pwOld').value;
        var a = root.querySelector('#pwNew').value;
        var b = root.querySelector('#pwNew2').value;
        var msg = root.querySelector('#pwMsg');
        msg.innerHTML = '';
        if (a !== b) {
          msg.innerHTML = '<div class="alert error"><span class="ic">!</span><div>The two new passwords do not match.</div></div>';
          return;
        }
        busy(btn, true, 'Saving…');
        call('changePassword', { currentPassword: oldPw, newPassword: a })
          .then(function (res) {
            saveToken(res.token);
            close();
            toast('Your password has been changed.');
            route();
          })
          .catch(function (err) {
            busy(btn, false);
            msg.innerHTML = '<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>';
          });
      });
    }
  });
}

/* ============================== NEW SCORES ================================= */
/*  The browser remembers which scores it has shown this student, per device.
    { init: true, k: { "<sectionId>|<assessmentId>": score } }
    The first check only records a baseline, so nobody is greeted with every
    score they already have marked as new.                                    */

function seenKey() { return 'ee.seen.' + ((S.profile && S.profile.id) || '').toLowerCase(); }
function seenLoad() {
  try { var v = JSON.parse(localStorage.getItem(seenKey()) || 'null'); if (v && v.k) return v; } catch (e) {}
  return { init: false, k: {} };
}
function seenSave(v) {
  try { localStorage.setItem(seenKey(), JSON.stringify(v)); } catch (e) { /* private browsing */ }
}
function scoreKey(sectionId, itemId) { return String(sectionId) + '|' + String(itemId); }
function isNewScore(seen, sectionId, itemId, score) {
  if (!seen.init || score === null || score === undefined) return false;
  var k = scoreKey(sectionId, itemId);
  return !seen.k.hasOwnProperty(k) || Number(seen.k[k]) !== Number(score);
}

function checkScoreUpdates() {
  call('student.updates', {}).then(function (u) {
    var seen = seenLoad();
    if (!seen.init) {
      var base = { init: true, k: {} };
      (u.scores || []).forEach(function (s) { base.k[scoreKey(s.sectionId, s.id)] = s.score; });
      seenSave(base);
      S.updates = { bySection: {}, total: 0 };
    } else {
      var by = {}, total = 0;
      (u.scores || []).forEach(function (s) {
        if (isNewScore(seen, s.sectionId, s.id, s.score)) { by[s.sectionId] = (by[s.sectionId] || 0) + 1; total++; }
      });
      S.updates = { bySection: by, total: total };
    }
    applyUpdateBadges();
  }).catch(function () { /* badges are a nicety; never break the page */ });
}

function applyUpdateBadges() {
  var u = S.updates;
  var root = $('#content');
  if (!u || !root || !root.querySelector('.card-grid')) return;
  $$('.class-card[data-open]', root).forEach(function (card) {
    var n = u.bySection[card.dataset.open] || 0;
    var old = card.querySelector('.badge.new');
    if (old) old.remove();
    if (n) {
      var b = document.createElement('span');
      b.className = 'badge new';
      b.textContent = n === 1 ? '1 new score' : n + ' new scores';
      card.appendChild(b);
    }
  });
  var note = $('#newScoresNote', root);
  if (note) note.remove();
  if (u.total) {
    var div = document.createElement('div');
    div.id = 'newScoresNote';
    div.className = 'alert ok';
    div.innerHTML = '<span class="ic">★</span><div>' +
      (u.total === 1 ? 'You have 1 new score' : 'You have ' + u.total + ' new scores') +
      ' since you last looked. Open a class to see it.</div>';
    root.insertBefore(div, root.firstChild);
  }
}

/* ============================== STUDENT VIEWS ============================= */

function renderStudentHome() {
  loading('Loading your classes…');
  call('student.home', {}).then(function (data) {
    S.student = data;
    drawStudentHome();
    checkScoreUpdates();
  }).catch(function (err) {
    setContent('<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>');
  });
}

function drawStudentHome() {
    var data = S.student;
    var semesters = data.semesters || [];
    var current = data.activeSemesterId;
    var classes = (data.classes || []).filter(function (c) {
      return !current || c.semesterId === current;
    });

    var html = '';
    if (data.announcement) {
      html += '<div class="alert info"><span class="ic">i</span><div>' + esc(data.announcement) + '</div></div>';
    }

    html += '<div class="row wrap" style="margin-bottom:16px">' +
      '<div><h2 style="font-size:20px">Hello, ' + esc(data.profile.firstName || data.profile.name) + '</h2>' +
      '<div class="small muted">' + esc(data.profile.id) +
      (data.profile.program ? ' · ' + esc(data.profile.program) : '') +
      (data.profile.yearLevel ? ' · Year ' + esc(data.profile.yearLevel) : '') + '</div></div>' +
      '<div class="spacer"></div>';
    if (semesters.length > 1) {
      html += '<select id="semPick" style="width:auto;min-width:220px">' +
        semesters.map(function (s) {
          return '<option value="' + esc(s.id) + '"' + (s.id === current ? ' selected' : '') + '>' +
            esc(s.name) + '</option>';
        }).join('') + '</select>';
    }
    html += '</div>';

    if (!classes.length) {
      html += empty('No classes yet',
        'You are not enrolled in any class for this semester. Your instructor adds you to a class before your scores appear here.');
    } else {
      html += '<div class="card-grid">' + classes.map(function (c) {
        return '<button class="class-card" data-open="' + esc(c.id) + '">' +
          '<div class="code">' + esc(c.subjectCode || '—') + '</div>' +
          '<div class="title">' + esc(c.subjectTitle || c.name) + '</div>' +
          '<div class="meta">' + esc(c.name) + (c.instructor ? ' · ' + esc(c.instructor) : '') + '</div>' +
          '<div class="row" style="gap:6px;margin-top:2px">' +
            (c.schedule ? '<span class="badge">' + esc(c.schedule) + '</span>' : '') +
            (c.room ? '<span class="badge">' + esc(c.room) + '</span>' : '') +
          '</div>' +
        '</button>';
      }).join('') + '</div>';
    }

    setContent(html);
    applyUpdateBadges();

    var pick = $('#semPick');
    if (pick) pick.addEventListener('change', function () {
      S.student.activeSemesterId = this.value;
      drawStudentHome();
    });
    $('#content').addEventListener('click', function (e) {
      var b = e.target.closest('[data-open]');
      if (b) renderStudentClass(b.dataset.open);
    });
}

function renderStudentClass(sectionId) {
  loading('Opening your class record…');
  call('student.class', { sectionId: sectionId }).then(function (d) {
    var sec = d.section;
    var seen = seenLoad();
    var g = d.grade || {};
    var pct = g.percent === null || g.percent === undefined ? null : g.percent;

    var html = '<button class="btn ghost sm" id="backHome" style="margin-bottom:14px">← All classes</button>';

    html += '<div class="card"><div class="card-body">' +
      '<div class="row wrap" style="gap:8px;margin-bottom:6px">' +
        '<span class="badge green">' + esc(sec.subjectCode) + '</span>' +
        '<span class="badge">' + esc(sec.name) + '</span>' +
        (sec.units ? '<span class="badge">' + esc(sec.units) + ' units</span>' : '') +
      '</div>' +
      '<h2 style="font-size:19px">' + esc(sec.subjectTitle) + '</h2>' +
      '<div class="small muted">' +
        (sec.instructor ? esc(sec.instructor) + ' · ' : '') +
        (sec.schedule ? esc(sec.schedule) + ' · ' : '') +
        (sec.room ? esc(sec.room) + ' · ' : '') +
        esc(sec.semesterName) +
      '</div>' +
    '</div></div>';

    if (d.survey && d.survey.url) {
      var done = d.survey.submitted === true;
      html += '<div class="card"><div class="card-body"><div class="row wrap" style="gap:12px">' +
        '<div style="flex:1;min-width:220px"><h3 style="font-size:15px;margin:0 0 4px">Course outcome self-assessment</h3>' +
        '<div class="small muted">' + (done
          ? 'Thank you, your response is recorded. You may answer again; only your latest answers count.'
          : 'Rate how well you can do each course outcome of this class. Use your student number on the form.') +
        '</div></div>' +
        (done ? '<span class="badge green">✓ Submitted</span>' : '') +
        '<a class="btn' + (done ? '' : ' primary') + '" target="_blank" rel="noopener" href="' + esc(d.survey.url) + '">' +
          (done ? 'Open the survey again ↗' : 'Answer the survey ↗') + '</a>' +
      '</div></div></div>';
    }

    html += materialsCard(sec.id, d.materials || []);
    html += assignmentsCard(sec.id, d.assignments || []);

            '<td class="num">' + (pending

            (d.showClassAverage
              ? '<td class="num muted hide-sm">' + (it.classAverage === null ? '—' : fmtScore(it.classAverage)) + '</td>'

            '<td class="num muted hide-sm">' + (it.weight ? fmt(it.weight, 0) + '%' : '—') + '</td>' +

      d.items.forEach(function (it) {

      seenSave(seen);

        S.updates.total -= S.updates.bySection[sec.id];

    }
  }).catch(function (err) {
    setContent('<button class="btn ghost sm" id="backHome" style="margin-bottom:14px">← All classes</button>' +

    var b = $('#backHome');
    if (b) b.addEventListener('click', renderStudentHome);
  });
}

/* ------------------------------ course files ------------------------------ */
/*  Syllabus and TOS PDFs. The bytes come through the API (the Drive files are
    not shared) and are drawn page by page with pdf.js, so they open the same
    way in every browser. If pdf.js can't load, the file is offered as a
    download instead.                                                          */

var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
var _pdfjs = null;

function loadPdfJs() {
  if (!_pdfjs) {
    _pdfjs = import(PDFJS_URL).then(function (lib) {
      lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      return lib;
    });
    _pdfjs.catch(function () { _pdfjs = null; });
  }
  return _pdfjs;
}

function base64Bytes(b64) {
  var bin = atob(b64), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function fileSize(n) {
  if (!n) return '';
  return n >= 1048576 ? fmt(n / 1048576, 1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}

/** Open a PDF returned by student.file / admin.file in a viewer. */
/** Draw every page of a PDF into `box` (fits its width). Resolves with the page count. */
function renderPdfInto(box, bytes) {
  return loadPdfJs().then(function (lib) {
    return lib.getDocument({ data: bytes.slice() }).promise;
  }).then(function (pdf) {
    box.innerHTML = '';
    var width = Math.max(300, box.clientWidth - 2);
    var ratio = Math.min(2, window.devicePixelRatio || 1);
    var chain = Promise.resolve();
    for (var n = 1; n <= pdf.numPages; n++) {
      (function (n) {
        chain = chain.then(function () {
          if (!document.body.contains(box)) return null;   // viewer closed or replaced
          return pdf.getPage(n).then(function (page) {
            var base = page.getViewport({ scale: 1 });
            var vp = page.getViewport({ scale: width / base.width * ratio });
            var canvas = document.createElement('canvas');
            canvas.width = Math.floor(vp.width);
            canvas.height = Math.floor(vp.height);
            canvas.style.width = Math.floor(vp.width / ratio) + 'px';
            canvas.setAttribute('aria-label', 'Page ' + n);
            box.appendChild(canvas);
            return page.render({ canvasContext: canvas.getContext('2d'), canvas: canvas, viewport: vp }).promise;
          });
        });
      })(n);
    }
    return chain.then(function () { return pdf.numPages; });
  });
}

function openPdf(res) {
  var bytes = base64Bytes(res.data);
  var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  var m = openModal({
    title: res.label + ' · ' + res.name,
    wide: true,
    body: '<div class="pdf-pages" id="pdfPages"><div class="loading"><span class="spinner"></span> Opening…</div></div>',
    footer: '<span class="small muted" id="pdfInfo"></span><div class="spacer"></div>' +
      '<a class="btn" href="' + url + '" download="' + esc(res.name) + '">⬇ Download</a>' +
      '<button class="btn primary" data-close="1">Close</button>'
  });
  m.root.querySelector('.modal').classList.add('pdf');
  m.root.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]') || e.target === m.root) setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  });
  var box = m.root.querySelector('#pdfPages');
  renderPdfInto(box, bytes).then(function (n) {
    var info = m.root.querySelector('#pdfInfo');
    if (info) info.textContent = n + ' page' + (n === 1 ? '' : 's');
  }).catch(function (err) {
    console.warn('pdf viewer', err);
    box.innerHTML = '<div class="alert warn"><span class="ic">!</span><div>The file can’t be shown here. ' +
      'Use <b>Download</b> to open it on your device.</div></div>';
  });
}

/**
 * Side-by-side grading: the student's PDF (or the problem set) on the left,
 * the class list and the score box on the right. Save & next moves on and the
 * next file is fetched ahead of time. `onClose(latest)` gets the fresh data.
 */
function openGrader(section, subs, startStudentId, onClose) {
  var a = subs.assignment, max = subs.max;
  var students = subs.students;
  var files = {};            // studentId → Promise<bytes>
  var setPdf = null;         // Promise<bytes> of the problem set
  var view = 'answer', idx = 0, onlyTodo = false, latest = subs;

  var m = openModal({
    title: 'Grade · ' + a.title,
    wide: true,
    body: '<div class="grader">' +
      '<div class="g-left"><div class="g-tabs">' +
        '<button class="btn sm g-tab on" data-view="answer">Student’s answer</button>' +
        (a.materialId ? '<button class="btn sm g-tab" data-view="set">Problem set</button>' : '') +
        '<span class="spacer"></span><span class="small muted" id="gInfo"></span></div>' +
        '<div class="pdf-pages g-pdf" id="gPdf"></div></div>' +
      '<div class="g-right"><div class="g-card" id="gCard"></div>' +
        '<label class="check small" style="margin:10px 0 6px"><input type="checkbox" id="gTodo"> Only show students still to grade</label>' +
        '<div class="g-list" id="gList"></div></div>' +
      '</div>',
    footer: '<span class="small muted">Enter = save & next · ↑ ↓ = previous / next student</span><div class="spacer"></div>' +
      '<button class="btn primary" id="gDone">Done</button>'
  });
  var root = m.root;
  root.querySelector('.modal').classList.add('grader-modal');

  function hasFile(st) { return st.submission && !st.submission.fileDeleted; }
  function todo(st) { return hasFile(st) && (st.score === null || st.score === undefined); }
  function shown() { return students.filter(function (st) { return !onlyTodo || todo(st); }); }

  function fetchFile(st) {
    if (!hasFile(st)) return null;
    if (!files[st.studentId]) {
      files[st.studentId] = call('admin.submission', { sectionId: section.id, assignmentId: a.id, studentId: st.studentId })
        .then(function (r) { return base64Bytes(r.data); });
      files[st.studentId].catch(function () { delete files[st.studentId]; });
    }
    return files[st.studentId];
  }

  function drawList() {
    var list = shown();
    $('#gList', root).innerHTML = list.map(function (st) {
      var i = students.indexOf(st);
      var chip = st.score !== null && st.score !== undefined ? '<span class="badge green">' + st.score + '</span>'
        : (hasFile(st) ? '<span class="badge gold">to grade</span>' : (st.submission ? '<span class="badge grey">file deleted</span>' : '<span class="badge grey">none</span>'));
      return '<button class="g-item' + (i === idx ? ' on' : '') + '" data-i="' + i + '"><span>' + esc(st.name) +
        (st.submission && st.submission.late ? ' <span class="badge gold">late</span>' : '') + '</span>' + chip + '</button>';
    }).join('') || '<p class="small muted">Everyone with a file is graded.</p>';
    $$('.g-item', root).forEach(function (b) { b.addEventListener('click', function () { go(Number(this.dataset.i)); }); });
    var on = $('.g-item.on', root);
    if (on) on.scrollIntoView({ block: 'nearest' });
  }

  function drawCard() {
    var st = students[idx];
    var sub = st.submission;
    $('#gCard', root).innerHTML =
      '<div class="small muted">' + (idx + 1) + ' of ' + students.length + '</div>' +
      '<h3 style="margin:2px 0">' + esc(st.name) + '</h3><div class="tiny muted">' + esc(st.studentId) + '</div>' +
      '<div class="small" style="margin:8px 0">' + (sub ? 'Submitted ' + esc(sub.submittedAt) + (sub.late ? ' <span class="badge gold">late</span>' : '') +
        (sub.fileDeleted ? '<br><span class="muted">File deleted after grading</span>' : '') : '<span class="muted">No submission</span>') + '</div>' +
      '<label class="small" for="gScore"><b>Score</b>' + (max ? ' (out of ' + max + ')' : '') + '</label>' +
      '<div class="row" style="gap:8px;margin-top:4px"><input type="number" id="gScore" min="0" step="any" value="' + (st.score === null || st.score === undefined ? '' : st.score) + '" class="g-score">' +
      (max ? '<span class="muted">/ ' + max + '</span>' : '') + '</div>' +
      '<button class="btn primary" id="gSave" style="width:100%;margin-top:10px">Save & next →</button>' +
      '<div class="row" style="gap:6px;margin-top:6px"><button class="btn sm" id="gPrev">← Previous</button><div class="spacer"></div><button class="btn sm" id="gNext">Next →</button></div>';
    var inp = $('#gScore', root);
    setTimeout(function () { inp.focus(); inp.select(); }, 30);
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); save(); }
      if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    });
    $('#gSave', root).addEventListener('click', save);
    $('#gPrev', root).addEventListener('click', function () { step(-1); });
    $('#gNext', root).addEventListener('click', function () { step(1); });
  }

  function drawPdf() {
    var box = $('#gPdf', root), info = $('#gInfo', root);
    var fresh = document.createElement('div');
    fresh.className = box.className;
    fresh.id = 'gPdf';
    box.replaceWith(fresh);
    box = fresh;
    var st = students[idx];
    var p;
    if (view === 'set') {
      setPdf = setPdf || call('admin.material', { sectionId: section.id, id: a.materialId }).then(function (r) { return base64Bytes(r.data); });
      p = setPdf;
      info.textContent = 'Problem set';
    } else {
      p = fetchFile(st);
      info.textContent = hasFile(st) ? st.submission.fileName : '';
    }
    if (!p) {
      box.innerHTML = '<div class="empty"><h4>' + (st.submission ? 'The file was deleted after grading.' : 'No file submitted.') + '</h4></div>';
      return;
    }
    box.innerHTML = '<div class="loading"><span class="spinner"></span> Opening…</div>';
    p.then(function (bytes) {
      if (!document.body.contains(box)) return null;
      return renderPdfInto(box, bytes).then(function (n) {
        if (document.body.contains(box)) info.textContent += ' · ' + n + ' page' + (n === 1 ? '' : 's');
      });
    }).catch(function (err) {
      if (document.body.contains(box)) box.innerHTML = '<div class="alert warn"><span class="ic">!</span><div>' + esc(err.message || 'The file can’t be shown.') + '</div></div>';
    });
    // fetch the next student's file ahead of time
    for (var k = idx + 1; k < students.length; k++) { if (hasFile(students[k])) { fetchFile(students[k]); break; } }
  }

  function go(i) {
    if (i < 0 || i >= students.length) return;
    idx = i;
    drawCard(); drawList(); drawPdf();
  }

  function step(d) {
    var list = shown(), pos = list.indexOf(students[idx]);
    var target = pos < 0 ? list[0] : list[pos + d];
    if (target) go(students.indexOf(target));
  }

  function nextToGrade() {
    for (var k = 1; k <= students.length; k++) {
      var i = (idx + k) % students.length;
      if (todo(students[i])) return i;
    }
    return -1;
  }

  function save() {
    var st = students[idx];
    var inp = $('#gScore', root);
    var v = inp.value.trim();
    var was = st.score === null || st.score === undefined ? '' : String(st.score);
    if (v === was) { var n0 = nextToGrade(); if (n0 > -1 && n0 !== idx) go(n0); else step(1); return; }
    if (v !== '' && (isNaN(Number(v)) || Number(v) < 0)) { toast('Type a number (or leave it blank).', 'error'); return; }
    var btn = $('#gSave', root);
    busy(btn, true, 'Saving…');
    call('admin.submissions.grade', { sectionId: section.id, assignmentId: a.id, changes: [{ studentId: st.studentId, value: v }] })
      .then(function (r) {
        latest = r;
        var fresh = {};
        r.students.forEach(function (x) { fresh[x.studentId] = x; });
        students.forEach(function (x, i) { if (fresh[x.studentId]) students[i] = fresh[x.studentId]; });
        if (r.problems && r.problems.length) toast(r.problems.join('; '), 'error');
        var n = nextToGrade();
        if (n > -1 && n !== idx) go(n); else { drawCard(); drawList(); toast('Saved. Everyone with a file is graded.', 'success'); }
      })
      .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
  }

  $$('.g-tab', root).forEach(function (b) {
    b.addEventListener('click', function () {
      view = this.dataset.view;
      $$('.g-tab', root).forEach(function (x) { x.classList.toggle('on', x.dataset.view === view); });
      drawPdf();
    });
  });
  $('#gTodo', root).addEventListener('change', function () { onlyTodo = this.checked; drawList(); });
  function finish() { m.close(); if (onClose) onClose(latest); }
  $('#gDone', root).addEventListener('click', finish);
  root.addEventListener('click', function (e) { if (e.target.closest('[data-close]')) { if (onClose) onClose(latest); } });

  var start = 0;
  students.forEach(function (st, i) { if (st.studentId === startStudentId) start = i; });
  if (!startStudentId) { var first = students.map(todo).indexOf(true); start = first > -1 ? first : 0; }
  go(start);
}

/** Materials in display order, grouped by week/unit (first appearance order). */
function groupMaterials(list) {
  var groups = [], byName = {};
  list.forEach(function (m) {
    var g = m.group || '';
    if (!byName[g]) { byName[g] = { name: g, items: [] }; groups.push(byName[g]); }
    byName[g].items.push(m);

  return groups;
}

function bindFileButtons(action, root) {

      var btn = this;

      call(action, { sectionId: btn.dataset.section, id: btn.dataset.viewFile })
        .then(function (res) { busy(btn, false); openPdf(res); })
        .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
    });
  });
}

function readPdfFile(file, maxBytes) {
  return new Promise(function (resolve, reject) {
    if (!file) return reject(new Error('Choose a PDF first.'));
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
      return reject(new Error('Please choose a PDF. Save Word or Excel files as PDF first.'));
    }
    if (file.size > maxBytes) return reject(new Error('The file is larger than ' + fileSize(maxBytes) + '.'));
    var reader = new FileReader();
    reader.onload = function () { resolve(String(reader.result).replace(/^data:[^,]*,/, '')); };
    reader.onerror = function () { reject(new Error('The file could not be read.')); };
    reader.readAsDataURL(file);
  });
}

            '<div class="file-acts">' +

            '<button class="btn sm ghost icon" data-move="1" title="Move down"' + (i === flat.length - 1 ? ' disabled' : '') + '>▼</button>' +
            '<button class="btn sm" data-view-file="' + esc(mt.id) + '" data-section="' + esc(section.id) + '">View</button>' +

    body.innerHTML = html;

  function run(action, params, msg) {
    body.classList.add('is-busy');
    return call(action, Object.assign({ sectionId: section.id }, params))
      .then(function (d) { body.classList.remove('is-busy'); editing = null; draw(d); if (msg) toast(msg); })
      .catch(function (err) { body.classList.remove('is-busy'); toast(err.message, 'error'); draw(); });

  function bind() {
    bindFileButtons('admin.material', body);

      var f = fileIn.files && fileIn.files[0];

    });
    var up = $('#matUpload', body);
    if (up) up.addEventListener('click', function () {
      var f = fileIn.files && fileIn.files[0];
      var also = $$('[data-also]', body).filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.also; });
      var params = {
        type: $('#matType', body).value, title: titleIn.value.trim(), group: $('#matGroup', body).value.trim(),
        visibleFrom: $('#matFrom', body).value, visible: $('#matVisible', body).checked, alsoSectionIds: also

      busy(up, true, 'Uploading…');
      readPdfFile(f, data.maxBytes).then(function (b64) {
        return run('admin.materials.upload', Object.assign(params, { name: f.name, mimeType: 'application/pdf', data: b64 }),
          'Uploaded' + (also.length ? ' to ' + (also.length + 1) + ' sections' : '') + '.');
      }).catch(function (err) { busy(up, false); toast(err.message, 'error'); });
    });
    $$('[data-move]', body).forEach(function (b) {
      b.addEventListener('click', function () {
        run('admin.materials.move', { id: this.closest('[data-id]').dataset.id, dir: Number(this.dataset.move) });
      });
    });
    $$('[data-edit]', body).forEach(function (b) {
      b.addEventListener('click', function () { editing = this.dataset.edit; draw(); });
    });
    $$('[data-cancel]', body).forEach(function (b) {
      b.addEventListener('click', function () { editing = null; draw(); });
    });
    $$('[data-save]', body).forEach(function (b) {
      b.addEventListener('click', function () {
        var row = this.closest('[data-id]'), v = {};
        $$('[data-f]', row).forEach(function (el) { v[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; });
        run('admin.materials.update', Object.assign({ id: this.dataset.save }, v), 'Saved.');
      });
    });
    $$('[data-replace]', body).forEach(function (b) {
      b.addEventListener('click', function () { replacing = this.dataset.replace; replaceInput.value = ''; replaceInput.click(); });
    });
    $$('[data-rm]', body).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = this.dataset.rm;
        var mt = data.materials.filter(function (x) { return x.id === id; })[0];
        confirmDialog('Remove “' + mt.title + '”?', 'Students of this class will no longer see it. Other sections keep their copy.', 'Remove', true)
          .then(function (ok) { if (ok) run('admin.materials.remove', { id: id }, 'Removed.'); });
      });
    });
  }

  replaceInput.addEventListener('change', function () {
    var f = replaceInput.files && replaceInput.files[0], id = replacing;
    if (!f || !id) return;
    readPdfFile(f, data.maxBytes).then(function (b64) {
      return run('admin.materials.replace', { id: id, name: f.name, mimeType: 'application/pdf', data: b64 }, 'File replaced.');
    }).catch(function (err) { toast(err.message, 'error'); });
  });

  call('admin.materials', { sectionId: section.id }).then(draw).catch(function (err) {
    body.innerHTML = '<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>';
  });
}

/** "2026-11-20 08:00" → "Fri, Nov 20 · 8:00 AM" */
function fmtWhen(t) {
  var m = String(t || '').match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/);
  if (!m) return t || '';
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4] || 0), Number(m[5] || 0));
  var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var mons = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var h = d.getHours(), ap = h < 12 ? 'AM' : 'PM';
  h = h % 12 || 12;
  return days[d.getDay()] + ', ' + mons[d.getMonth()] + ' ' + d.getDate() +
    (m[4] ? ' · ' + h + ':' + ('0' + d.getMinutes()).slice(-2) + ' ' + ap : '');
}

/** call() that retries when the server is busy or the connection dropped. */
function callRetry(action, payload, tries) {
  tries = tries || 4;
  return call(action, payload).catch(function (err) {
    var transient = /reach the server|busy|too many|timed out|service|unexpected|try again/i.test(err.message || '');
    if (!transient || tries <= 1) throw err;
    return new Promise(function (r) { setTimeout(r, 1200 + Math.random() * 2500); })
      .then(function () { return callRetry(action, payload, tries - 1); });
  });
}

/* ------------------------------ taking an exam ----------------------------- */

var EXAM = null;

function renderExam(sectionId, examId) {
  loading('Opening the exam…');
  callRetry('student.exam.start', { sectionId: sectionId, examId: examId }).then(function (x) {
    if (x.done) { examFinished(sectionId, { message: x.message }); return; }
    var local = null;
    try { local = JSON.parse(localStorage.getItem('ee.exam.' + x.attemptId) || 'null'); } catch (e) { local = null; }
    EXAM = {
      sectionId: sectionId, x: x, offset: x.serverNow - Date.now(),
      answers: (local && local.a) || x.answers || [], away: Math.max((local && local.away) || 0, x.away || 0),
      dirty: false, timer: null, saver: null, submitting: false
    };
    drawExam();
  }).catch(function (err) {
    setContent('<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>' +
      '<button class="btn" id="exBack">← Back to the class</button>');
    $('#exBack').addEventListener('click', function () { renderStudentClass(sectionId); });
  });
}

function examLocalSave() {
  try { localStorage.setItem('ee.exam.' + EXAM.x.attemptId, JSON.stringify({ a: EXAM.answers, away: EXAM.away })); } catch (e) { /* private mode */ }
}

function drawExam() {
  var x = EXAM.x;
  var html = '<div class="exam-bar"><div><b>' + esc(x.title) + '</b><div class="tiny muted"><span id="exCount"></span> · <span id="exSaved">not saved yet</span></div></div>' +
    '<div class="spacer"></div><div class="exam-timer" id="exTimer">--:--</div>' +
    '<button class="btn primary" id="exSubmit">Submit</button></div>' +
    '<div class="exam-qs">' + x.questions.map(function (q) {
      return '<div class="card exam-q" id="q' + q.n + '"><div class="card-body">' +
        '<div class="exam-qn">Question ' + (q.n + 1) + ' of ' + x.items + '</div>' +
        '<div class="exam-text">' + esc(q.text) + '</div>' +
        (q.image ? '<div class="exam-img" data-img="' + q.n + '"><span class="small muted">Loading the figure…</span></div>' : '') +
        '<div class="exam-choices">' + q.choices.map(function (c, i) {
          var on = EXAM.answers[q.n] === i;
          return '<label class="exam-choice' + (on ? ' on' : '') + '"><input type="radio" name="q' + q.n + '" value="' + i + '"' + (on ? ' checked' : '') + '>' +
            '<span class="exam-letter">' + 'ABCD'.charAt(i) + '</span><span>' + esc(c) + '</span></label>';
        }).join('') + '</div></div></div>';
    }).join('') + '</div>' +
    '<div class="row" style="margin:18px 0 40px"><div class="spacer"></div><button class="btn primary" id="exSubmit2">Submit the exam</button></div>';
  setContent(html);
  updateExamCount();

  $$('.exam-choice input').forEach(function (inp) {
    inp.addEventListener('change', function () {
      var n = Number(this.name.slice(1));
      EXAM.answers[n] = Number(this.value);
      $$('input[name="q' + n + '"]').forEach(function (o) { o.closest('.exam-choice').classList.toggle('on', o.checked); });
      EXAM.dirty = true;
      examLocalSave();
      updateExamCount();
    });
  });
  $$('[data-img]').forEach(function (box) {
    callRetry('student.exam.image', { attemptId: x.attemptId, n: Number(box.dataset.img) }).then(function (r) {
      box.innerHTML = '<img alt="Figure for question ' + (Number(box.dataset.img) + 1) + '" src="data:' + esc(r.mimeType) + ';base64,' + r.data + '">';
    }).catch(function () { box.innerHTML = '<span class="small muted">The figure could not be loaded.</span>'; });
  });
  $('#exSubmit').addEventListener('click', function () { confirmExamSubmit(); });
  $('#exSubmit2').addEventListener('click', function () { confirmExamSubmit(); });

  clearInterval(EXAM.timer);
  EXAM.timer = setInterval(tickExam, 500);
  tickExam();
  clearInterval(EXAM.saver);
  EXAM.saver = setInterval(function () { if (EXAM && EXAM.dirty) saveExamNow(); }, 75000 + Math.random() * 30000);
  window.onbeforeunload = function () { return 'Your exam is still running.'; };
  document.addEventListener('visibilitychange', examAway);
}

function examAway() {
  if (!EXAM || EXAM.submitting) return;
  if (document.visibilityState === 'hidden') {
    EXAM.away++;
    examLocalSave();
    saveExamNow();
  }
}

function updateExamCount() {
  var n = EXAM.answers.filter(function (a) { return a !== null && a !== undefined; }).length;
  var el = $('#exCount');
  if (el) el.textContent = n + ' of ' + EXAM.x.items + ' answered';
}

function tickExam() {
  if (!EXAM) return;
  var left = Math.max(0, EXAM.x.deadline - (Date.now() + EXAM.offset));
  var s = Math.floor(left / 1000);
  var el = $('#exTimer');
  if (el) {
    el.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    el.classList.toggle('low', s <= 300);
  }
  if (left <= 0 && !EXAM.submitting) submitExamNow(true);
}

function saveExamNow() {
  if (!EXAM || EXAM.submitting) return;
  var sent = EXAM.answers.slice();
  EXAM.dirty = false;
  callRetry('student.exam.save', { attemptId: EXAM.x.attemptId, answers: sent, away: EXAM.away }, 3).then(function (r) {
    if (!EXAM) return;
    if (r.serverNow) EXAM.offset = r.serverNow - Date.now();
    var el = $('#exSaved');
    if (el) el.textContent = r.done ? 'already submitted' : 'saved ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }).catch(function () {
    if (!EXAM) return;
    EXAM.dirty = true;
    var el = $('#exSaved');
    if (el) el.textContent = 'not saved — will retry (answers kept on this device)';
  });
}

function confirmExamSubmit() {
  var blank = EXAM.x.items - EXAM.answers.filter(function (a) { return a !== null && a !== undefined; }).length;
  confirmDialog('Submit the exam?', blank ? blank + ' question(s) have no answer. You cannot change your answers after submitting.' :
    'You cannot change your answers after submitting.', 'Submit', false).then(function (ok) { if (ok) submitExamNow(false); });
}

function submitExamNow(timeUp) {
  if (!EXAM || EXAM.submitting) return;
  EXAM.submitting = true;
  clearInterval(EXAM.timer);
  clearInterval(EXAM.saver);
  var ex = EXAM;
  loading(timeUp ? 'Time is up — submitting your answers…' : 'Submitting…');
  callRetry('student.exam.submit', { attemptId: ex.x.attemptId, answers: ex.answers, away: ex.away }, 6).then(function (r) {
    try { localStorage.removeItem('ee.exam.' + ex.x.attemptId); } catch (e) { /* ignore */ }
    window.onbeforeunload = null;
    document.removeEventListener('visibilitychange', examAway);
    EXAM = null;
    examFinished(ex.sectionId, r);
  }).catch(function (err) {
    ex.submitting = false;
    drawExam();
    toast('Not submitted yet: ' + err.message + ' Your answers are kept — press Submit again.', 'error');
  });
}

function examFinished(sectionId, r) {
  window.onbeforeunload = null;
  setContent('<div class="card" style="max-width:560px;margin:40px auto"><div class="card-body" style="text-align:center;padding:32px">' +
    '<div style="font-size:42px">✓</div><h2 style="margin:6px 0">' + (r.message ? esc(r.message) : 'Exam submitted') + '</h2>' +
    (r.submittedAt ? '<p class="muted">Received ' + esc(r.submittedAt) + (r.late ? ' (after the time limit — your last saved answers were used)' : '') + '.</p>' : '') +
    (r.score !== null && r.score !== undefined ? '<p style="font-size:22px;margin:14px 0"><b>' + r.score + ' / ' + r.items + '</b></p>'
      : (r.submittedAt ? '<p class="small muted">Your score will appear here once your teacher releases it.</p>' : '')) +
    '<button class="btn primary" id="exDone">Back to the class</button></div></div>');
  $('#exDone').addEventListener('click', function () { renderStudentClass(sectionId); });
}

function fromLocalInput(v) { return v ? String(v).replace('T', ' ').slice(0, 16) : ''; }

function columnPicker(columns, prefix, defaults) {

  return '<div class="field"><label>Gradebook column</label>' +

    '<div class="row wrap" style="gap:10px;margin:4px 0 6px 24px">' +
    (defaults.max !== false ? '<label class="small">Max score <input type="number" min="1" id="' + prefix + 'Max" value="' + (defaults.max || 100) + '" style="width:80px"></label>' : '') +
    '<label class="small">Weight % <input type="number" min="0" step="0.5" id="' + prefix + 'Weight" value="0" style="width:80px"></label></div>' +
    (columns.length ? '<label class="check"><input type="radio" name="' + prefix + 'Col" value="existing"> An existing column with no scores yet: ' +
      '<select id="' + prefix + 'Existing" style="width:auto">' + columns.map(function (c) {
        return '<option value="' + esc(c.id) + '">' + esc(c.name) + ' (max ' + c.max + ')</option>';
      }).join('') + '</select></label>' : '') +
    '<span class="hint">Columns that already have scores (like a graded exam) are never touched.</span></div>';
}

function readColumn(body, prefix) {
  var mode = ($('input[name="' + prefix + 'Col"]:checked', body) || {}).value || 'new';
  return {
    mode: mode,
    assessmentId: mode === 'existing' ? $('#' + prefix + 'Existing', body).value : '',
    max: $('#' + prefix + 'Max', body) ? Number($('#' + prefix + 'Max', body).value) : undefined,
    weight: Number($('#' + prefix + 'Weight', body).value) || 0
  };
}

function siblingChecks(siblings) {
  return siblings.length ? '<div class="field"><label>Also give it to</label>' + siblings.map(function (s) {
    return '<label class="check small"><input type="checkbox" data-also="' + esc(s.id) + '" checked> ' + esc(s.name) + '</label>';
  }).join('') + '<span class="hint">Other sections of the same subject this semester (each gets its own copy).</span></div>' : '';
}

function checkedSiblings(body) {
  return $$('[data-also]', body).filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.also; });
}

/* ------------------------------ assignments ------------------------------- */

function manageAssignments(section) {
  var M = lmsModal('Problem sets · ' + (section.subjectCode ? section.subjectCode + ' ' : '') + section.name);
  var data = null;

  function run(action, params, msg) {
    M.body.classList.add('is-busy');
    return call(action, Object.assign({ sectionId: section.id }, params)).then(function (d) {
      M.body.classList.remove('is-busy');
      if (msg) toast(msg);
      return d;
    }).catch(function (err) { M.body.classList.remove('is-busy'); toast(err.message, 'error'); throw err; });
  }

  function list(d) {
    if (d) data = d;
    var html = '<details class="mat-add"' + (data.assignments.length ? '' : ' open') + '><summary><b>＋ New problem set</b> ' +
      '<span class="small muted">students download it and upload their answers as one PDF</span></summary><div class="mat-form">' +
      '<div class="grid2"><div class="field"><label>Title</label><input type="text" id="aTitle" maxlength="120" placeholder="e.g. Problem Set 5"></div>' +
      '<div class="field"><label>Due</label><input type="datetime-local" id="aDue"></div></div>' +
      '<div class="field"><label>Instructions <span class="faint">(optional)</span></label><textarea id="aInstr" rows="2" maxlength="2000" placeholder="e.g. Answer items 1–10. Show your solutions."></textarea></div>' +
      '<div class="field"><label>Problem set PDF students download</label>' +
      '<input type="file" id="aFile" accept="application/pdf,.pdf">' +
      '<div class="small muted" style="margin:6px 0 4px">or one already in Materials:</div><select id="aMat"><option value="">None</option>' +
      data.materials.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.title) + '</option>'; }).join('') + '</select>' +
      '<span class="hint">An uploaded PDF is also added to Materials (type Problem set), for every section you give this to.</span></div>' +
      '<label class="check"><input type="checkbox" id="aLate"> Accept late submissions (marked late)</label>' +
      columnPicker(data.columns, 'a') + siblingChecks(data.siblings) +
      '<div class="row" style="margin-top:10px"><div class="spacer"></div><button class="btn primary" id="aCreate">Create problem set</button></div></div></details>';
    if (!data.assignments.length) html += '<p class="small muted" style="margin:14px 2px 0">No problem sets yet.</p>';
    html += '<div class="file-list">' + data.assignments.map(function (a) {
      var c = a.counts;
      return '<div class="file-row"><div class="file-txt"><b>' + esc(a.title) + '</b> ' +
        (a.open ? '' : '<span class="badge grey">Hidden</span> ') + (a.allowLate ? '<span class="badge">late OK</span>' : '') +
        '<div class="tiny muted">Due ' + esc(fmtWhen(a.dueAt)) + ' · column “' + esc(a.columnName) + '”</div>' +
        '<div class="small" style="margin-top:3px">' + c.submitted + ' / ' + c.students + ' submitted' + (c.late ? ' (' + c.late + ' late)' : '') +
        ' · ' + c.graded + ' graded · ' + c.files + ' file' + (c.files === 1 ? '' : 's') + ' stored (' + fileSize(c.bytes || 0) + ')</div></div>' +
        '<div class="file-acts"><button class="btn sm primary" data-open="' + esc(a.id) + '">Submissions</button>' +
        '<button class="btn sm" data-aedit="' + esc(a.id) + '">Edit</button>' +
        '<button class="btn sm ghost" data-arm="' + esc(a.id) + '" title="Remove">✕</button></div></div>';
    }).join('') + '</div>';
    M.body.innerHTML = html;

    $('#aCreate', M.body).addEventListener('click', function () {
      var btn = this;
      var p = {
        title: $('#aTitle', M.body).value.trim(), dueAt: fromLocalInput($('#aDue', M.body).value),
        instructions: $('#aInstr', M.body).value, materialId: $('#aMat', M.body).value,
        allowLate: $('#aLate', M.body).checked, open: true, column: readColumn(M.body, 'a'), alsoSectionIds: checkedSiblings(M.body)
      };
      if (!p.title) { toast('Give the problem set a title.', 'error'); return; }
      if (!p.dueAt) { toast('Set the due date and time.', 'error'); return; }
      var f = $('#aFile', M.body).files && $('#aFile', M.body).files[0];
      busy(btn, true, f ? 'Uploading the PDF…' : 'Creating…');
      var step = f ? readPdfFile(f, 20 * 1024 * 1024).catch(function (e) { toast(e.message, 'error'); throw e; }).then(function (b64) {
        return run('admin.materials.upload', {
          type: 'PROBLEM_SET', title: p.title, group: '', visible: true, visibleFrom: '',
          name: f.name, mimeType: 'application/pdf', data: b64, alsoSectionIds: p.alsoSectionIds
        });
      }).then(function (mres) {
        // the newest Problem-set material with this title is the one just uploaded
        var mine = mres.materials.filter(function (m) { return m.type === 'PROBLEM_SET' && m.title === p.title; });
        if (mine.length) p.materialId = mine[mine.length - 1].id;
      }) : Promise.resolve();
      step.then(function () {
        busy(btn, true, 'Creating…');
        return run('admin.assignment.create', p, 'Problem set created.');
      }).then(list).catch(function () { busy(btn, false); /* the error was already shown */ });
    });
    $$('[data-open]', M.body).forEach(function (b) { b.addEventListener('click', function () { openSubs(this.dataset.open); }); });
    $$('[data-aedit]', M.body).forEach(function (b) { b.addEventListener('click', function () { editForm(this.dataset.aedit); }); });
    $$('[data-arm]', M.body).forEach(function (b) {
      b.addEventListener('click', function () {
        var a = data.assignments.filter(function (x) { return x.id === b.dataset.arm; })[0];
        confirmDialog('Remove “' + a.title + '”?', 'Its ' + a.counts.submitted + ' submitted answer file(s) are deleted. The gradebook column and any scores stay.', 'Remove', true)
          .then(function (ok) { if (ok) run('admin.assignment.remove', { id: a.id }, 'Removed.').then(list); });
      });
    });
  }

  function editForm(id) {
    var a = data.assignments.filter(function (x) { return x.id === id; })[0];
    M.body.innerHTML = '<button class="btn sm ghost" id="aBack">← All problem sets</button><h3 style="margin:12px 0">Edit · ' + esc(a.title) + '</h3>' +
      '<div class="grid2"><div class="field"><label>Title</label><input type="text" id="eTitle" maxlength="120" value="' + esc(a.title) + '"></div>' +
      '<div class="field"><label>Due</label><input type="datetime-local" id="eDue" value="' + esc(toLocalInput(a.dueAt)) + '"></div></div>' +
      '<div class="field"><label>Instructions</label><textarea id="eInstr" rows="3" maxlength="2000">' + esc(a.instructions) + '</textarea></div>' +
      '<div class="field"><label>Problem set</label><select id="eMat"><option value="">None</option>' + data.materials.map(function (m) {
        return '<option value="' + esc(m.id) + '"' + (m.id === a.materialId ? ' selected' : '') + '>' + esc(m.title) + '</option>';
      }).join('') + '</select></div>' +
      '<label class="check"><input type="checkbox" id="eLate"' + (a.allowLate ? ' checked' : '') + '> Accept late submissions</label>' +
      '<label class="check"><input type="checkbox" id="eOpen"' + (a.open ? ' checked' : '') + '> Shown to students</label>' +
      '<div class="row" style="margin-top:12px"><div class="spacer"></div><button class="btn primary" id="eSave">Save</button></div>';
    $('#aBack', M.body).addEventListener('click', function () { list(); });
    $('#eSave', M.body).addEventListener('click', function () {
      run('admin.assignment.update', {
        id: a.id, title: $('#eTitle', M.body).value.trim(), dueAt: fromLocalInput($('#eDue', M.body).value),
        instructions: $('#eInstr', M.body).value, materialId: $('#eMat', M.body).value,
        allowLate: $('#eLate', M.body).checked, open: $('#eOpen', M.body).checked
      }, 'Saved.').then(list);
    });
  }

  function openSubs(id) {
    M.body.innerHTML = '<div class="loading"><span class="spinner"></span> Loading submissions…</div>';
    call('admin.submissions', { sectionId: section.id, assignmentId: id }).then(drawSubs).catch(function (err) {
      toast(err.message, 'error'); list();
    });
  }

  function drawSubs(s) {
    var a = s.assignment;
    var withFile = s.students.filter(function (x) { return x.submission && !x.submission.fileDeleted; }).length;
    var html = '<button class="btn sm ghost" id="aBack">← All problem sets</button>' +
      '<div class="row wrap" style="margin:12px 0"><div><h3 style="margin:0">' + esc(a.title) + '</h3>' +
      '<div class="small muted">Due ' + esc(fmtWhen(a.dueAt)) + ' · scores go to “' + esc(s.columnName || '—') + '” (max ' + (s.max || '—') + ')</div></div>' +
      '<div class="spacer"></div><button class="btn sm primary" id="sGrade">✎ Grade side by side</button>' +
      '<button class="btn sm" id="sDel">🗑 Delete graded files</button>' +
      '<button class="btn sm" id="sSave">Save scores</button></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Student</th><th>Submitted</th><th>File</th><th class="num" style="width:120px">Score</th></tr></thead><tbody>' +
      s.students.map(function (st) {
        var sub = st.submission;
        return '<tr><td>' + esc(st.name) + '<div class="tiny muted">' + esc(st.studentId) + '</div></td>' +
          '<td class="small">' + (sub ? esc(sub.submittedAt) + (sub.late ? ' <span class="badge gold">late</span>' : '') : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (sub ? (sub.fileDeleted ? '<span class="tiny muted">deleted after grading</span>'
            : '<button class="btn sm" data-sgrade="' + esc(st.studentId) + '">Grade</button> <button class="btn sm ghost" data-sview="' + esc(st.studentId) + '">View</button> <span class="tiny muted">' + fileSize(sub.size) + '</span>') : '') + '</td>' +
          '<td class="num"><input type="number" min="0" step="any" data-score="' + esc(st.studentId) + '" value="' + (st.score === null ? '' : st.score) +
          '" data-was="' + (st.score === null ? '' : st.score) + '" style="width:90px;text-align:right"></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="tiny faint">' + withFile + ' file(s) stored. “Delete graded files” removes only the files of students who already have a score; the record and the score stay.</p>';
    M.body.innerHTML = html;
    $('#aBack', M.body).addEventListener('click', function () { call('admin.assignments', { sectionId: section.id }).then(list); });
    $('#sGrade', M.body).addEventListener('click', function () { openGrader(section, s, '', drawSubs); });
    $$('[data-sgrade]', M.body).forEach(function (b) {
      b.addEventListener('click', function () { openGrader(section, s, this.dataset.sgrade, drawSubs); });
    });
    $$('[data-sview]', M.body).forEach(function (b) {
      b.addEventListener('click', function () {
        var btn = this;
        busy(btn, true, '…');
        call('admin.submission', { sectionId: section.id, assignmentId: a.id, studentId: btn.dataset.sview })
          .then(function (r) { busy(btn, false); openPdf(r); })
          .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
      });
    });
    $('#sSave', M.body).addEventListener('click', function () {
      var changes = $$('[data-score]', M.body).filter(function (i) { return i.value !== i.dataset.was; })
        .map(function (i) { return { studentId: i.dataset.score, value: i.value }; });
      if (!changes.length) { toast('No changes to save.'); return; }
      run('admin.submissions.grade', { assignmentId: a.id, changes: changes }).then(function (r) {
        toast(r.saved + ' score(s) saved.' + (r.problems && r.problems.length ? ' ' + r.problems.join('; ') : ''));
        drawSubs(r);
      });
    });
    $('#sDel', M.body).addEventListener('click', function () {
      run('admin.submissions.deleteGraded', { assignmentId: a.id, dryRun: true }).then(function (c) {
        if (!c.count) { toast('No graded submissions with files to delete.'); return; }
        confirmDialog('Delete ' + c.count + ' graded file(s)?', 'This frees ' + fileSize(c.bytes) + '. Who submitted, when, and the scores are kept. ' +
          'The files go to your Drive trash, which Google empties after 30 days.', 'Delete files', true).then(function (ok) {
          if (!ok) return;
          run('admin.submissions.deleteGraded', { assignmentId: a.id }).then(function (r) {
            toast(r.deleted.count + ' file(s) deleted (' + fileSize(r.deleted.bytes) + ').');
            drawSubs(r);
          });
        });
      });
    });
  }

  call('admin.assignments', { sectionId: section.id }).then(list).catch(function (err) {
    M.body.innerHTML = '<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>';
  });
}

      '<div class="small muted">' + e.items + ' questions · ' + e.duration + ' min · ' + esc(fmtWhen(e.opensAt)) + ' → ' + esc(fmtWhen(e.closesAt)) + '</div></div><div class="spacer"></div>' +
      (e.showScore === 'IMMEDIATE' ? '<span class="badge">scores shown at once</span>'

      '<div class="stat"><div class="v">' + (s.mean === null ? '—' : fmt(s.mean, 0) + '%') + '</div><div class="k">Average</div></div>' +
      '<div class="stat"><div class="v">' + (s.high === null ? '—' : fmt(s.high, 0) + '%') + '</div><div class="k">Highest</div></div>' +
      '<div class="stat"><div class="v">' + (s.low === null ? '—' : fmt(s.low, 0) + '%') + '</div><div class="k">Lowest</div></div></div>' +
      (!e.released && e.showScore !== 'IMMEDIATE' ? '<p class="small muted">Students can’t see their scores yet. “Release scores” puts them in the gradebook column and shows them to students.</p>' : '') +
      '<div class="table-wrap"><table><thead><tr><th>Student</th><th>Status</th><th class="num">Score</th><th>Submitted</th><th class="num" title="Times the student left the exam page">Left page</th><th></th></tr></thead><tbody>' +
      r.students.map(function (st) {
        return '<tr><td>' + esc(st.name) + '<div class="tiny muted">' + esc(st.studentId) + '</div></td>' +
          '<td>' + (label[st.status] || '') + (st.status === 'in_progress' ? ' <span class="tiny muted">until ' + esc(st.deadline) + '</span>' : '') + '</td>' +
          '<td class="num">' + (st.score === null ? '—' : '<b>' + st.score + '</b> / ' + st.items) + '</td>' +
          '<td class="small">' + esc(st.submittedAt || '') + '</td>' +
          '<td class="num">' + (st.away ? '<span class="badge ' + (st.away >= 3 ? 'red' : 'gold') + '">' + st.away + '</span>' : (st.score === null ? '' : '0')) + '</td>' +
          '<td>' + (st.status !== 'not_started' ? '<button class="btn sm ghost" data-reset="' + esc(st.studentId) + '" title="Let this student take it again">Reset</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    if (r.analysis.length) {
      html += '<h4 style="margin:18px 0 6px">By unit and level</h4><div class="small">' + r.groups.map(function (g) {
        return '<span class="badge ' + (g.percent < 50 ? 'red' : (g.percent < 70 ? 'gold' : 'green')) + '">' + esc(g.unit) + ' · ' + esc(g.level) + ': ' + fmt(g.percent, 0) + '%</span>';
      }).join(' ') + '</div>' +
        '<h4 style="margin:18px 0 6px">Item analysis <span class="small muted">(hardest first)</span></h4><div class="table-wrap"><table><thead><tr>' +
        '<th>Question</th><th>Unit · Level</th><th class="num">Key</th><th style="width:150px">Correct</th><th>Answers picked</th></tr></thead><tbody>' +
        r.analysis.map(function (q) {
          return '<tr><td class="small">' + esc(q.text) + '<div class="tiny faint">' + esc(q.id) + (q.co ? ' · ' + esc(q.co) : '') + '</div></td>' +
            '<td class="small">' + esc(q.unit) + ' · ' + esc(q.level) + '</td><td class="num"><b>' + esc(q.answer) + '</b></td>' +
            '<td>' + meter(q.percent) + '<div class="tiny muted">' + q.correct + ' of ' + q.shown + '</div></td>' +
            '<td class="tiny">' + ['A', 'B', 'C', 'D', '—'].filter(function (k) { return q.picks[k]; }).map(function (k) {
              return (k === q.answer ? '<b>' : '') + k + ': ' + q.picks[k] + (k === q.answer ? '</b>' : '');
            }).join(' · ') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    M.body.innerHTML = html;
    $('#xBack', M.body).addEventListener('click', function () { run('admin.exams', {}).then(list); });
    $('#xRef', M.body).addEventListener('click', function () { results(e.id); });
    var rel = $('#xRelease', M.body);
    if (rel) rel.addEventListener('click', function () {

    $$('[data-reset]', M.body).forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = this.dataset.reset;
        confirmDialog('Let ' + sid + ' take the exam again?', 'Their attempt and score are deleted. They get a new random set when they start again (while the exam is open).', 'Reset', true)
          .then(function (ok) { if (ok) run('admin.exam.reset', { examId: e.id, studentId: sid }, 'Reset.').then(drawResults); });
      });
    });
  }

  call('admin.exams', { sectionId: section.id }).then(list).catch(function (err) {
    M.body.innerHTML = '<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>';
  });
}
