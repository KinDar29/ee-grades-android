function sectionModal(section) {
  var a = S.admin;
  var editing = section && section.id;
  openModal({
    title: editing ? 'Edit class' : 'New class',
    body:
      '<div class="grid2">' +
        '<div class="field"><label>Subject</label><select id="fSubject">' +
          a.subjects.map(function (s) {
            return '<option value="' + esc(s.id) + '"' +
              (editing && s.id === section.subjectId ? ' selected' : '') + '>' +
              esc(s.code) + ' — ' + esc(s.title) + '</option>';
          }).join('') + '</select></div>' +
        '<div class="field"><label>Section name</label>' +
          '<input type="text" id="fName" placeholder="BSIT 1-A" value="' +
          esc(editing ? section.name : '') + '"></div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="field"><label>Instructor</label><input type="text" id="fInstructor" value="' +
          esc(editing ? section.instructor : (S.profile.name || '')) + '"></div>' +
        '<div class="field"><label>Room</label><input type="text" id="fRoom" value="' +
          esc(editing ? section.room : '') + '"></div>' +
      '</div>' +
      '<div class="field"><label>Schedule</label><input type="text" id="fSchedule" ' +
        'placeholder="MWF 8:00–9:00 AM" value="' + esc(editing ? section.schedule : '') + '"></div>' +
      '<div class="field"><label>Self-assessment survey link (Google Form)</label>' +
        '<input type="url" id="fSurvey" placeholder="https://forms.gle/…" value="' +
        esc(editing ? section.surveyUrl || '' : '') + '">' +
        '<span class="hint">Students in this class see an “Answer the survey” button.</span></div>' +
      '<div class="field"><label>Course outcome assessment workbook</label>' +
        '<input type="text" id="fWorkbook" placeholder="Google Sheets link" value="' +
        esc(editing && section.workbookId ? 'https://docs.google.com/spreadsheets/d/' + section.workbookId + '/edit' : '') + '">' +
        '<span class="hint">Read (never changed) for the Indirect assessment dashboard.</span></div>' +
      (editing
        ? '<div class="field"><label>Status</label><select id="fStatus">' +
          ['Active', 'Archived'].map(function (v) {
            return '<option' + (String(section.status).toLowerCase() === v.toLowerCase() ? ' selected' : '') +
              '>' + v + '</option>';
          }).join('') + '</select></div>'
        : '<p class="tiny faint">A new Google Sheet will be created for this class inside the semester folder.</p>') +
      '<div id="secMsg"></div>',
    footer:
      (editing ? '<button class="btn danger" id="secDelete">Delete…</button><div class="spacer"></div>' : '') +
      '<button class="btn" data-close="1">Cancel</button>' +
      '<button class="btn primary" id="secSave">' + (editing ? 'Save' : 'Create class') + '</button>',
    onMount: function (root, close) {
      root.querySelector('#secSave').addEventListener('click', function () {
        var btn = this;
        var payload = {
          id: editing ? section.id : undefined,
          semesterId: a.semesterId,
          subjectId: root.querySelector('#fSubject') ? root.querySelector('#fSubject').value : '',
          name: root.querySelector('#fName').value.trim(),
          instructor: root.querySelector('#fInstructor').value.trim(),
          room: root.querySelector('#fRoom').value.trim(),
          schedule: root.querySelector('#fSchedule').value.trim(),
          surveyUrl: root.querySelector('#fSurvey').value.trim(),
          workbook: root.querySelector('#fWorkbook').value.trim()
        };
        if (editing) payload.status = root.querySelector('#fStatus').value;
        busy(btn, true, editing ? 'Saving…' : 'Creating…');
        call(editing ? 'admin.section.update' : 'admin.section.create', payload)
          .then(function () { close(); toast(editing ? 'Class updated.' : 'Class created.'); refreshAdmin(); })
          .catch(function (err) {
            busy(btn, false);
            root.querySelector('#secMsg').innerHTML =
              '<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>';
          });
      });

      var del = root.querySelector('#secDelete');
      if (del) del.addEventListener('click', function () {
        confirmDialog('Delete this class?',
          'The class will be removed from the portal and its Google Sheet moved to your Drive trash. ' +
          'You can restore it from the trash for 30 days.',
          'Delete class', true).then(function (yes) {
          if (!yes) return;
          call('admin.section.remove', { id: section.id, mode: 'delete' })
            .then(function () { close(); toast('Class deleted.'); refreshAdmin(); })
            .catch(function (err) { toast(err.message, 'error'); });
        });
      });
    }
  });
}

/* ------------------------------- gradebook -------------------------------- */

function renderGradebook(sectionId) {
  loading('Opening class record…');
  S.dirty = {};
  call('admin.section.data', { sectionId: sectionId }).then(function (d) {
    S.gb = d;
    drawGradebook();
  }).catch(function (err) {
    S.section = null;
    setContent('<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>' +
      '<button class="btn" id="backCls">← Back to classes</button>');
    $('#backCls').addEventListener('click', function () { S.section = null; renderAdmin(); });
  });
}

function drawGradebook() {
  var d = S.gb;
  var sec = d.section;
  var html = '<button class="btn ghost sm" id="backCls" style="margin-bottom:12px">← All classes</button>';

  html += '<div class="row wrap" style="margin-bottom:14px">' +
    '<div><h2 style="font-size:19px">' + esc(sec.subjectCode) + ' · ' + esc(sec.name) + '</h2>' +
    '<div class="small muted">' + esc(sec.subjectTitle) + ' · ' + esc(sec.semesterName) +
    ' · ' + d.students.length + ' students</div></div>' +
    '<div class="spacer"></div>' +
    '<a class="btn sm" target="_blank" rel="noopener" href="' + esc(d.spreadsheetUrl) + '">Open in Sheets ↗</a>' +
    '<button class="btn sm" id="gbAddStudents">+ Students</button>' +
    '<button class="btn sm primary" id="gbAddAsm">+ Requirement</button>' +
    '<button class="btn sm" id="gbFiles">📄 Course files</button>' +
    '<button class="btn sm gold" id="gbExport">⬇ Class record (PDF)</button>' +
    '<button class="btn sm" id="gbMore">⋯</button>' +
  '</div>';

  if (d.assessments.length && d.totalWeight > 0 && Math.abs(d.totalWeight - 100) > 0.01) {
    html += '<div class="alert warn"><span class="ic">!</span><div>The weights on this class add up to <b>' +
      fmt(d.totalWeight, 2) + '%</b>, not 100%. Running grades are scaled to the weight recorded so far, ' +
      'so this still works — adjust the weights if that was not intended.</div></div>';
  }

  if (!d.students.length) {
    html += '<div class="card"><div class="card-body">' + empty('No students in this class',
      'Add students from your registry, or type their IDs straight into the Grades tab of the sheet.',
      '<button class="btn primary" id="gbAddStudents2" style="margin-top:12px">+ Add students</button>') +
      '</div></div>';
  } else {
    html += '<div class="gb-wrap"><table class="gb"><thead><tr>' +
      '<th class="stick">Student</th>' +
      d.assessments.map(function (a) {
        return '<th class="asm num" data-asm="' + esc(a.id) + '" title="Click to edit">' +
          '<div class="asm-name">' + esc(a.name) + (a.published ? '' : ' 🔒') + '</div>' +
          '<div class="asm-sub">/' + fmtScore(a.max) + (a.weight ? ' · ' + fmt(a.weight, 0) + '%' : '') + '</div>' +
        '</th>';
      }).join('') +
      '<th class="num">%</th><th class="num">Grade</th>' +
      '<th title="INC and Dropped are set here; everything else comes from the grade">Status</th><th></th>' +
      '</tr></thead><tbody>' +
      d.students.map(function (s) {
        return '<tr data-sid="' + esc(s.studentId) + '">' +
          '<td class="stick"><div class="gb-name">' + esc(s.lastName + ', ' + s.firstName) + '</div>' +
          '<div class="gb-id">' + esc(s.studentId) + '</div></td>' +
          d.assessments.map(function (a) {
            var v = s.scores[a.id];
            return '<td class="num"><input class="score" type="number" step="any" min="0" ' +
              'data-sid="' + esc(s.studentId) + '" data-aid="' + esc(a.id) + '" ' +
              'value="' + (v === null || v === undefined ? '' : esc(v)) + '"></td>';
          }).join('') +
          '<td class="num total">' + (s.grade.percent === null ? '—' : fmt(s.grade.percent, 1)) + '</td>' +
          '<td class="num total">' + (s.grade.grade === null ? '—' : fmt(s.grade.grade, 2)) + '</td>' +
          '<td><select class="fs" data-fs="' + esc(s.studentId) + '" style="width:auto;min-width:104px;padding:4px 6px">' +
            '<option value=""' + (s.finalStatus ? '' : ' selected') + '>By grade</option>' +
            '<option value="INC"' + (s.finalStatus === 'INC' ? ' selected' : '') + '>INC</option>' +
            '<option value="Dropped"' + (s.finalStatus === 'Dropped' ? ' selected' : '') + '>Dropped</option>' +
          '</select></td>' +
          '<td class="right"><button class="btn ghost sm" data-drop="' + esc(s.studentId) + '" title="Remove from class">✕</button></td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>';

    html += '<div class="sticky-actions"><span class="small muted" id="dirtyCount">No unsaved changes</span>' +
      '<div class="spacer"></div>' +
      '<button class="btn" id="gbRevert" disabled>Discard</button>' +
      '<button class="btn primary" id="gbSave" disabled>Save scores</button></div>';
  }

  setContent(html);
  bindGradebook();
}

/** The Summary of Grades part of the "Class record ready" dialog. */

    return html + '<div class="alert warn"><span class="ic">!</span><div>The Summary of Grades could not be ' +
      'made: ' + esc(sog.error) + '</div></div></div>';
  }
  var rows = sog.rows || [];
  html += '<p class="small" style="margin-bottom:10px">' + esc(sog.faculty) + ' · ' + esc(sog.semester) + ' · ' +
    rows.length + (rows.length === 1 ? ' row' : ' rows') + ' — one summary for every subject this semester.</p>' +
    '<div class="table-wrap" style="margin-bottom:12px"><table><thead><tr>' +
    '<th>Subject</th><th>Course</th><th class="num">Yr</th><th class="num">Total</th><th class="num">Passed</th>' +
    '<th class="num">Drop</th><th class="num">INC</th><th class="num">4</th><th class="num">Failed</th></tr></thead><tbody>' +
    rows.map(function (r) {

        '</td><td>' + esc(r.course) + '</td><td class="num">' + esc(r.year) + '</td>' +
        '<td class="num">' + r.total + '</td><td class="num">' + r.passed + '</td><td class="num">' + r.dropped +
        '</td><td class="num">' + r.inc + '</td><td class="num">' + r.four + '</td><td class="num">' + r.failed + '</td></tr>';

}

function bindGradebook() {
  var d = S.gb;
  $('#backCls').addEventListener('click', function () { S.section = null; S.gb = null; renderAdmin(); });

  var add = $('#gbAddStudents'), add2 = $('#gbAddStudents2');
  if (add) add.addEventListener('click', enrollModal);
  if (add2) add2.addEventListener('click', enrollModal);
  var aa = $('#gbAddAsm');
  if (aa) aa.addEventListener('click', function () { assessmentModal(null); });

  /* --- turn the base64 the server sends back into a real file download --- */
  function saveBase64(b64, filename, mime) {
    try {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], { type: mime || 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 5000);
      return true;
    } catch (err) {
      return false;
    }
  }

  /* --- INC / Dropped per student (saved straight away) --- */
  $$('select.fs').forEach(function (sel) {
    sel.addEventListener('change', function () {
      var el = this;
      var sid = el.dataset.fs;
      var student = d.students.filter(function (s) { return s.studentId === sid; })[0];
      var before = student ? student.finalStatus || '' : '';
      el.disabled = true;
      call('admin.section.status', { sectionId: d.section.id, studentId: sid, status: el.value })
        .then(function (res) {
          el.disabled = false;
          if (student) student.finalStatus = res.status;
          toast(res.status ? sid + ' marked ' + res.status + '.' : sid + ' is back to "by grade".');
        })
        .catch(function (err) {
          el.disabled = false;
          el.value = before;
          toast(err.message, 'error');
        });
    });
  });

  var filesBtn = $('#gbFiles');
  if (filesBtn) filesBtn.addEventListener('click', function () { manageCourseFiles(d.section); });

  var exportBtn = $('#gbExport');
  if (exportBtn) exportBtn.addEventListener('click', function () {
    var btn = this;
    busy(btn, true, 'Building… (about a minute)');
    call('admin.export.pdf', { sectionId: d.section.id })
      .then(function (res) {
        busy(btn, false);
        openModal({
          title: 'Class record ready',
          body:
            '<p class="small" style="margin-bottom:14px">' + esc(res.students) +
              ' student(s), with every requirement, totals, grade, standing and rank.</p>' +
            '<div class="copybox" style="margin-bottom:16px">' + esc(res.name) + '</div>' +
            '<div class="stack" style="gap:10px">' +
              '<button class="btn primary block" id="pdfDl">⬇ Download the PDF</button>' +
              (res.driveUrl
                ? '<a class="btn block" target="_blank" rel="noopener" href="' + esc(res.driveUrl) +
                  '">Open it in Drive ↗</a>'
                : '') +
              (res.sheetUrl
                ? '<a class="btn block ghost" target="_blank" rel="noopener" href="' + esc(res.sheetUrl) +
                  '">See the “Class Record” tab in the sheet ↗</a>'
                : '') +
            '</div>' +
            '<p class="tiny faint" style="margin-top:14px">A copy is filed in the ' +
            '<b>Class Records</b> folder of this semester, so you can print it again later ' +
            'without rebuilding it.</p>' +
            '<div id="pdfMsg"></div>' +
            summaryOfGradesHtml(res.summary),
          footer: '<button class="btn" data-close="1">Close</button>',
          onMount: function (root) {
            var sogBtn = root.querySelector('#sogDl');
            if (sogBtn) sogBtn.addEventListener('click', function () {
              var ok = saveBase64(res.summary.base64, res.summary.name,
                'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
              root.querySelector('#sogMsg').innerHTML = ok
                ? '<div class="alert ok" style="margin:14px 0 0"><span class="ic">✓</span>' +
                  '<div>Saved to your downloads.</div></div>'
                : '<div class="alert warn" style="margin:14px 0 0"><span class="ic">!</span>' +
                  '<div>Your browser blocked the direct download. Use “Open it in Drive” instead.</div></div>';
            });
            root.querySelector('#pdfDl').addEventListener('click', function () {
              var ok = saveBase64(res.base64, res.name);
              root.querySelector('#pdfMsg').innerHTML = ok
                ? '<div class="alert ok" style="margin:14px 0 0"><span class="ic">✓</span>' +
                  '<div>Saved to your downloads.</div></div>'
                : '<div class="alert warn" style="margin:14px 0 0"><span class="ic">!</span>' +
                  '<div>Your browser blocked the direct download. Use “Open it in Drive” instead.</div></div>';
            });
          }
        });
      })
      .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
  });

  var more = $('#gbMore');
  if (more) more.addEventListener('click', function () {
    openModal({
      title: 'Class tools',
      body:
        '<div class="stack">' +
          '<button class="btn block" id="tSummary">Rebuild the Summary tab in the sheet</button>' +
          '<button class="btn block" id="tSync">Re-read the class list from the sheet</button>' +
          '<a class="btn block" target="_blank" rel="noopener" href="' + esc(d.spreadsheetUrl) + '">Open the Google Sheet ↗</a>' +
        '</div>' +
        '<p class="tiny faint" style="margin-top:14px">Use “Re-read the class list” after you add or delete ' +
        'student rows directly in the Grades tab.</p>',
      footer: '<button class="btn" data-close="1">Close</button>',
      onMount: function (root, close) {
        root.querySelector('#tSummary').addEventListener('click', function () {
          var b = this; busy(b, true, 'Rebuilding…');
          call('admin.summary.rebuild', { sectionId: d.section.id })
            .then(function (r) { busy(b, false); toast('Summary rebuilt for ' + r.rows + ' students.'); })
            .catch(function (e) { busy(b, false); toast(e.message, 'error'); });
        });
        root.querySelector('#tSync').addEventListener('click', function () {
          var b = this; busy(b, true, 'Syncing…');
          call('admin.section.sync', { sectionId: d.section.id })
            .then(function () { close(); toast('Class list refreshed.'); renderGradebook(d.section.id); })
            .catch(function (e) { busy(b, false); toast(e.message, 'error'); });
        });
      }
    });
  });

  var head = $('#content');
  head.addEventListener('click', function (e) {
    var th = e.target.closest('th[data-asm]');
    if (th) {
      var a = d.assessments.filter(function (x) { return x.id === th.dataset.asm; })[0];
      if (a) assessmentModal(a);
      return;
    }
    var drop = e.target.closest('[data-drop]');
    if (drop) {
      var sid = drop.dataset.drop;
      confirmDialog('Remove from class?',
        'This removes ' + sid + ' and their scores from this class record. The student stays in your registry.',
        'Remove', true).then(function (yes) {
        if (!yes) return;
        call('admin.section.unenroll', { sectionId: d.section.id, studentId: sid })
          .then(function () { toast('Student removed.'); renderGradebook(d.section.id); })
          .catch(function (err) { toast(err.message, 'error'); });
      });
    }
  });

  $$('.score').forEach(function (input) {
    input.addEventListener('input', function () { markDirty(this); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        moveFocus(this, e.key === 'ArrowUp' ? -1 : 1);
      }
    });
  });

  var saveBtn = $('#gbSave');
  if (saveBtn) saveBtn.addEventListener('click', saveScores);
  var revert = $('#gbRevert');
  if (revert) revert.addEventListener('click', function () { renderGradebook(S.gb.section.id); });
}

function markDirty(input) {
  var key = input.dataset.sid + '||' + input.dataset.aid;
  S.dirty[key] = input.value;
  input.classList.add('dirty');
  var n = Object.keys(S.dirty).length;
  var label = $('#dirtyCount');
  if (label) label.textContent = n === 0 ? 'No unsaved changes'
    : n + ' unsaved change' + (n === 1 ? '' : 's');
  var save = $('#gbSave'), revert = $('#gbRevert');
  if (save) save.disabled = n === 0;
  if (revert) revert.disabled = n === 0;
}

function moveFocus(input, delta) {
  var cells = $$('.score[data-aid="' + input.dataset.aid + '"]');
  var i = cells.indexOf(input);
  var next = cells[i + delta];
  if (next) { next.focus(); next.select(); }
}

function saveScores() {
  var btn = $('#gbSave');
  var changes = Object.keys(S.dirty).map(function (k) {
    var parts = k.split('||');
    return { studentId: parts[0], assessmentId: parts[1], value: S.dirty[k] };
  });
  if (!changes.length) return;
  busy(btn, true, 'Saving…');
  call('admin.scores.save', { sectionId: S.gb.section.id, changes: changes })
    .then(function (res) {
      S.dirty = {};
      if (res.problems && res.problems.length) {
        toast(res.saved + ' saved · ' + res.problems.length + ' skipped: ' + res.problems[0], 'warn');
      } else {
        toast(res.saved + ' score' + (res.saved === 1 ? '' : 's') + ' saved.');
      }
      renderGradebook(S.gb.section.id);
    })
    .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
}

function assessmentModal(a) {
  var editing = !!a;
  var types = S.admin.assessmentTypes || ['Exam', 'Quiz', 'Other'];
  openModal({
    title: editing ? 'Edit requirement' : 'New requirement',
    body:
      '<div class="field"><label>Name</label><input type="text" id="aName" ' +
        'placeholder="Midterm Exam" value="' + esc(editing ? a.name : '') + '"></div>' +
      '<div class="grid3">' +
        '<div class="field"><label>Type</label><select id="aType">' +
          types.map(function (t) {
            return '<option' + (editing && a.type === t ? ' selected' : '') + '>' + esc(t) + '</option>';
          }).join('') + '</select></div>' +
        '<div class="field"><label>Max score</label><input type="number" step="any" min="0" id="aMax" value="' +
          esc(editing ? a.max : 100) + '"></div>' +
        '<div class="field"><label>Weight %</label><input type="number" step="any" min="0" id="aWeight" value="' +
          esc(editing ? a.weight : 0) + '"></div>' +
      '</div>' +
      '<div class="field"><label>Date</label><input type="date" id="aDate" value="' +
        esc(editing ? a.date : '') + '"></div>' +
      '<div class="field"><label class="checkline"><input type="checkbox" id="aPub"' +
        (!editing || a.published ? ' checked' : '') + '> Visible to students</label>' +
        '<span class="hint">Uncheck while you are still encoding scores.</span></div>' +
      '<p class="tiny faint">Leave every weight at 0 to grade on total points instead of weighted averages.</p>' +
      '<div id="aMsg"></div>',
    footer:
      (editing ? '<button class="btn danger" id="aDelete">Delete…</button><div class="spacer"></div>' : '') +
      '<button class="btn" data-close="1">Cancel</button>' +
      '<button class="btn primary" id="aSave">' + (editing ? 'Save' : 'Add requirement') + '</button>',
    onMount: function (root, close) {
      root.querySelector('#aSave').addEventListener('click', function () {
        var btn = this;
        var payload = {
          sectionId: S.gb.section.id,
          id: editing ? a.id : undefined,
          name: root.querySelector('#aName').value.trim(),
          type: root.querySelector('#aType').value,
          max: root.querySelector('#aMax').value,
          weight: root.querySelector('#aWeight').value,
          date: root.querySelector('#aDate').value,
          published: root.querySelector('#aPub').checked
        };
        busy(btn, true, 'Saving…');
        call(editing ? 'admin.assessment.update' : 'admin.assessment.create', payload)
          .then(function () { close(); toast('Saved.'); renderGradebook(S.gb.section.id); })
          .catch(function (err) {
            busy(btn, false);
            root.querySelector('#aMsg').innerHTML =
              '<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>';
          });
      });
      var del = root.querySelector('#aDelete');
      if (del) del.addEventListener('click', function () {
        confirmDialog('Delete this requirement?',
          'The column and every score in it will be deleted from the class sheet. This cannot be undone from here.',
          'Delete', true).then(function (yes) {
          if (!yes) return;
          call('admin.assessment.delete', { sectionId: S.gb.section.id, id: a.id })
            .then(function () { close(); toast('Requirement deleted.'); renderGradebook(S.gb.section.id); })
            .catch(function (err) { toast(err.message, 'error'); });
        });
      });
    }
  });
}

function enrollModal() {
  var enrolled = {};
  S.gb.students.forEach(function (s) { enrolled[s.studentId.toLowerCase()] = true; });

  openModal({
    title: 'Add students to ' + S.gb.section.name,
    wide: true,
    body:
      '<div class="field"><input type="text" id="enSearch" placeholder="Search the registry by name, ID or program…"></div>' +
      '<div id="enList" style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:8px">' +
        '<div class="loading"><span class="spinner"></span> Loading registry…</div></div>' +
      '<div class="section-title">Or paste Student IDs</div>' +
      '<textarea id="enPaste" placeholder="21-123456&#10;21-123457" style="min-height:80px"></textarea>' +
      '<div id="enMsg"></div>',
    footer: '<button class="btn" data-close="1">Cancel</button>' +
      '<button class="btn primary" id="enAdd">Add selected</button>',
    onMount: function (root, close) {
      var listBox = root.querySelector('#enList');

      function load(q) {
        call('admin.students.list', { q: q || '', pageSize: 300 }).then(function (res) {
          var items = res.items.filter(function (s) { return !enrolled[s.id.toLowerCase()]; });
          if (!items.length) {
            listBox.innerHTML = '<div class="empty small" style="padding:26px">' +
              (res.total ? 'Everyone matching is already in this class.' : 'No students found. Register them first under the Students tab.') +
              '</div>';
            return;
          }
          listBox.innerHTML = items.map(function (s) {
            return '<label class="checkline" style="padding:8px 12px;border-bottom:1px solid var(--border)">' +
              '<input type="checkbox" value="' + esc(s.id) + '">' +
              '<span><b>' + esc(s.lastName + ', ' + s.firstName) + '</b> ' +
              '<span class="tiny faint mono">' + esc(s.id) + '</span>' +
              (s.program ? '<div class="tiny muted">' + esc(s.program) +
                (s.yearLevel ? ' · Year ' + esc(s.yearLevel) : '') + '</div>' : '') +
              '</span></label>';
          }).join('');
        }).catch(function (err) {
          listBox.innerHTML = '<div class="alert error" style="margin:12px"><span class="ic">!</span><div>' +
            esc(err.message) + '</div></div>';
        });
      }
      load('');

      var timer;
      root.querySelector('#enSearch').addEventListener('input', function () {
        var v = this.value;
        clearTimeout(timer);
        timer = setTimeout(function () { load(v); }, 260);
      });

      root.querySelector('#enAdd').addEventListener('click', function () {
        var btn = this;
        var ids = $$('#enList input:checked', root).map(function (i) { return i.value; });
        root.querySelector('#enPaste').value.split(/[\s,;]+/).forEach(function (v) {
          if (v.trim()) ids.push(v.trim());
        });
        if (!ids.length) { toast('Select at least one student.', 'warn'); return; }
        busy(btn, true, 'Adding…');
        call('admin.section.enroll', { sectionId: S.gb.section.id, studentIds: ids })
          .then(function (res) {
            close();
            if (res.missing && res.missing.length) {
              toast(res.added + ' added · not in registry: ' + res.missing.join(', '), 'warn');
            } else {
              toast(res.added + ' student(s) added.');
            }
            renderGradebook(S.gb.section.id);
          })
          .catch(function (err) {
            busy(btn, false);
            root.querySelector('#enMsg').innerHTML =
              '<div class="alert error"><span class="ic">!</span><div>' + esc(err.message) + '</div></div>';
          });
      });
    }
  });
}

/* ------------------------------ students tab ----------------------------- */

function renderStudentsTab() {
  var html = '<div class="row wrap" style="margin-bottom:16px">' +
    '<div><h2 style="font-size:20px">Student registry</h2>' +
    '<div class="small muted">Everyone who can sign in to the portal</div></div>' +
    '<div class="spacer"></div>' +
    '<button class="btn" id="stImport">Import list</button>' +
    '<button class="btn primary" id="stNew">+ New student</button></div>' +
    '<div class="card"><div class="card-head">' +
      '<input type="text" id="stSearch" placeholder="Search by name, ID, e-mail or program…" ' +
      'style="max-width:340px" value="' + esc(S.studentQuery) + '">' +
      '<div class="spacer"></div><span class="small muted" id="stCount"></span>' +
    '</div><div id="stBody"><div class="loading"><span class="spinner"></span> Loading…</div></div></div>';

  setContent(html);
  $('#stNew').addEventListener('click', function () { studentModal(null); });
  $('#stImport').addEventListener('click', importModal);
  var timer;
  $('#stSearch').addEventListener('input', function () {
    var v = this.value;
    clearTimeout(timer);
    timer = setTimeout(function () { S.studentQuery = v; S.studentPage = 1; loadStudents(); }, 280);
  });

  // Bound once here, not inside loadStudents — #stBody survives every reload
  // of the table, so re-binding there would stack duplicate handlers.
  $('#stBody').addEventListener('click', function (e) {
    var ed = e.target.closest('[data-sedit]');
    if (ed) {
      var s = (S.studentItems || []).filter(function (x) { return x.id === ed.dataset.sedit; })[0];
      if (s) studentModal(s);
      return;
    }
    var rs = e.target.closest('[data-sreset]');
    if (rs) { resetPasswordModal(rs.dataset.sreset); return; }
    var pg = e.target.closest('[data-page]');
    if (pg && !pg.disabled) {
      S.studentPage = Number(pg.dataset.page);
      loadStudents();
    }
  });

  loadStudents();
}

function loadStudents() {
  call('admin.students.list', { q: S.studentQuery, page: S.studentPage, pageSize: 50 })
    .then(function (res) {
      S.studentItems = res.items;
      $('#stCount').textContent = res.total + ' student' + (res.total === 1 ? '' : 's');
      if (!res.items.length) {
        $('#stBody').innerHTML = empty('No students found',
          S.studentQuery ? 'Try a different search.' : 'Add students one by one, or import a list.');
        return;
      }
      var pages = Math.ceil(res.total / res.pageSize);
      $('#stBody').innerHTML =
        '<div class="table-wrap"><table><thead><tr>' +
        '<th>Name</th><th>Student no.</th><th>Program</th><th>Password</th><th>Last sign-in</th><th></th>' +
        '</tr></thead><tbody>' +
        res.items.map(function (s) {
          var pw = s.hasOwnPassword
            ? '<span class="badge green">set by student</span>'
            : '<span class="mono tiny">' + esc(s.currentPassword || '—') + '</span>';
          return '<tr>' +
            '<td><b>' + esc(s.lastName + ', ' + s.firstName) + '</b>' +
              (String(s.status).toLowerCase() === 'inactive' ? ' <span class="badge red">inactive</span>' : '') +
              (s.middleName ? '<div class="tiny muted">' + esc(s.middleName) + '</div>' : '') + '</td>' +
            '<td class="mono small">' + esc(s.id) + '</td>' +
            '<td class="small">' + esc(s.program || '—') +
              (s.yearLevel ? '<div class="tiny muted">Year ' + esc(s.yearLevel) + '</div>' : '') + '</td>' +
            '<td>' + pw + '</td>' +
            '<td class="tiny muted nowrap">' + esc(s.lastLogin || 'never') + '</td>' +
            '<td class="right nowrap">' +
              '<button class="btn sm" data-sedit="' + esc(s.id) + '">Edit</button> ' +
              '<button class="btn sm ghost" data-sreset="' + esc(s.id) + '">Reset password</button>' +
            '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        (pages > 1
          ? '<div class="row" style="padding:12px 16px;border-top:1px solid var(--border)">' +
            '<button class="btn sm" data-page="' + (S.studentPage - 1) + '"' +
              (S.studentPage <= 1 ? ' disabled' : '') + '>← Previous</button>' +

function scaleRowHtml(r) {
  return '<tr>' +
    '<td class="num"><input type="number" step="any" class="sc-min" value="' + esc(r.min) + '"></td>' +
    '<td class="num"><input type="number" step="any" class="sc-max" value="' + esc(r.max) + '"></td>' +
    '<td class="num"><input type="number" step="0.01" class="sc-grade" value="' + esc(r.grade) + '"></td>' +
    '<td><input type="text" class="sc-remark" value="' + esc(r.remark || '') + '"></td>' +
    '<td class="right"><button class="btn ghost sm" data-scdel="1">✕</button></td>' +
  '</tr>';
}

function bindSettings() {
  $('#cfgSave').addEventListener('click', function () {
    var btn = this;
    busy(btn, true, 'Saving…');
    call('admin.settings.save', {
      values: {
        PORTAL_TITLE: $('#cfgTitle').value.trim(),
        PORTAL_SUBTITLE: $('#cfgSub').value.trim(),
        ANNOUNCEMENT: $('#cfgAnn').value.trim(),
        CONTACT_EMAIL: $('#cfgContact').value.trim(),
        DEFAULT_PASSWORD: $('#cfgDefPw').value.trim(),
        SHOW_RUNNING_GRADE: $('#cfgRun').checked ? 'TRUE' : 'FALSE',
        SHOW_CLASS_AVERAGE: $('#cfgAve').checked ? 'TRUE' : 'FALSE',
        ALLOW_PASSWORD_CHANGE: $('#cfgChg').checked ? 'TRUE' : 'FALSE',
        COUNT_BLANK_AS_ZERO: $('#cfgZero').checked ? 'TRUE' : 'FALSE'
      }
    }).then(function () {
      busy(btn, false);
      toast('Settings saved.');
      return call('portal', {});
    }).then(function (info) { S.portal = info; applyBranding(info); refreshAdmin(); })
      .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
  });

  $('#scaleAdd').addEventListener('click', function () {
    var tbody = $('#scaleTable tbody');
    var tr = document.createElement('tr');
    tr.innerHTML = scaleRowHtml({ min: '', max: '', grade: '', remark: '' });
    tbody.appendChild(tr.firstChild ? tr.firstChild : tr);
    tbody.lastElementChild.querySelector('input').focus();
  });

  $('#scaleTable').addEventListener('click', function (e) {
    var b = e.target.closest('[data-scdel]');
    if (b) b.closest('tr').remove();
  });

  $('#scaleSave').addEventListener('click', function () {
    var btn = this;
    var rows = $$('#scaleTable tbody tr').map(function (tr) {
      return {
        min: tr.querySelector('.sc-min').value,
        max: tr.querySelector('.sc-max').value,
        grade: tr.querySelector('.sc-grade').value,
        remark: tr.querySelector('.sc-remark').value
      };
    });
    busy(btn, true, 'Saving…');
    call('admin.scale.save', { rows: rows })
      .then(function (r) { busy(btn, false); toast(r.rows + ' bands saved.'); refreshAdmin(); })
      .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
  });

  var copy = $('#copyUrl');
  if (copy) copy.addEventListener('click', function () {
    var url = S.admin.links.webApp;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { toast('Link copied.'); },
        function () { toast('Could not copy — select the text instead.', 'warn'); });
    } else {
      toast('Select the link and copy it manually.', 'warn');
    }
  });

  $('#toolPw').addEventListener('click', function () {
    var btn = this; busy(btn, true, 'Applying…');
    call('admin.tools.applyPasswords', {})
      .then(function (r) { busy(btn, false); toast(r.students + ' student password(s) applied.'); })
      .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
  });

  $('#toolSync').addEventListener('click', function () {
    var btn = this; busy(btn, true, 'Syncing…');
    call('admin.tools.syncAll', { semesterId: S.admin.semesterId })
      .then(function (r) {
        busy(btn, false);
        toast(r.synced + ' of ' + r.total + ' classes refreshed.');
        refreshAdmin();
      })
      .catch(function (err) { busy(btn, false); toast(err.message, 'error'); });
  });
}
</script>
