<style>
/* ==========================================================================
   Electrical Engineering — Grades Portal · stylesheet
   ========================================================================== */

:root {
  --green-900: #08301f;
  --green-800: #0b3d2c;
  --green-700: #0f5132;
  --green-600: #17694a;
  --green-100: #e6f1ec;
  --gold-600: #a8851f;
  --gold-500: #c9a227;
  --gold-100: #fbf3dc;

  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #fafbfa;
  --border: #e0e6e3;
  --border-strong: #c9d3ce;
  --text: #13201a;
  --muted: #5f6f68;
  --faint: #8b9a94;

  --danger: #b42318;
  --danger-bg: #fdf3f2;
  --warn: #b54708;
  --warn-bg: #fffaeb;
  --ok: #067647;
  --ok-bg: #ecfdf3;
  --info-bg: #eef4ff;
  --info: #175cd3;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(16, 32, 26, .06), 0 1px 3px rgba(16, 32, 26, .08);
  --shadow-md: 0 4px 12px rgba(16, 32, 26, .08), 0 2px 4px rgba(16, 32, 26, .05);
  --shadow-lg: 0 20px 45px rgba(8, 48, 31, .18);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1512;
    --surface: #151e1a;
    --surface-2: #1a2420;
    --border: #253430;
    --border-strong: #33453f;
    --text: #e7efeb;
    --muted: #9bafa7;
    --faint: #7b8f87;
    --green-100: #142b22;
    --gold-100: #2b240f;
    --danger-bg: #2a1614;
    --warn-bg: #2a2010;
    --ok-bg: #10261b;
    --info-bg: #131f33;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, .45);
    --shadow-lg: 0 20px 45px rgba(0, 0, 0, .6);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--green-600); }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0 0 .75em; }

/* ------------------------------- utilities ------------------------------- */
.hidden { display: none !important; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.mono { font-family: var(--mono); }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.spacer { flex: 1; }

/* --------------------------------- shell --------------------------------- */
#app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  background: linear-gradient(135deg, var(--green-800), var(--green-700) 60%, var(--green-600));
  color: #fff;
  padding: 0 20px;
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-md);
  position: sticky;
  top: 0;
  z-index: 40;
}
.topbar .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar .mark {
  width: 42px; height: 36px; border-radius: 10px; flex: none;
  background: var(--gold-500); color: var(--green-900);
  display: grid; place-items: center; font-weight: 800; font-size: 11px;
  letter-spacing: .01em;
}
.topbar .titles { min-width: 0; }
.topbar .t1 { font-weight: 700; font-size: 15px; line-height: 1.2; }
.topbar .t2 { font-size: 12px; opacity: .8; line-height: 1.3; }
.topbar .who { text-align: right; line-height: 1.25; }
.topbar .who .n { font-size: 13px; font-weight: 600; }
.topbar .who .r { font-size: 11px; opacity: .78; }

.tabbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  position: sticky;
  top: 62px;
  z-index: 30;
}
.tabbar button {
  appearance: none; background: none; border: 0; cursor: pointer;
  padding: 12px 14px; font: inherit; font-size: 14px; font-weight: 550;
  color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap;
}
.tabbar button:hover { color: var(--text); }
.tabbar button.on { color: var(--green-600); border-bottom-color: var(--green-600); }

main { flex: 1; padding: 22px 20px 60px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.wrap.narrow { max-width: 560px; }
.wrap.mid { max-width: 860px; }

/* --------------------------------- cards --------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 16px; }
.card-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.card-head h3 { font-size: 15px; }
.card-body { padding: 18px; }
.card-body.tight { padding: 12px; }

.section-title {
  font-size: 12px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--faint); margin: 26px 0 10px;
}
.section-title:first-child { margin-top: 0; }

/* -------------------------------- buttons -------------------------------- */
.btn {
  appearance: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
  padding: 9px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  display: inline-flex; align-items: center; gap: 7px; line-height: 1.2;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--green-700); border-color: var(--green-700); color: #fff; }
.btn.primary:hover { background: var(--green-600); border-color: var(--green-600); }
.btn.gold { background: var(--gold-500); border-color: var(--gold-600); color: #2a2205; }
.btn.gold:hover { background: var(--gold-600); color: #fff; }
.btn.danger { color: var(--danger); border-color: #f0c4c0; background: var(--danger-bg); }
.btn.danger:hover { background: #fbe6e4; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn.block { width: 100%; justify-content: center; }
.btn.icon { padding: 7px 9px; }

/* --------------------------------- forms --------------------------------- */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field > label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--faint); }
input[type=text], input[type=password], input[type=number], input[type=date],
input[type=email], select, textarea {
  font: inherit; font-size: 14px; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 9px 11px; width: 100%;
  transition: border-color .12s, box-shadow .12s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--green-600);
  box-shadow: 0 0 0 3px rgba(23, 105, 74, .14);
}
textarea { resize: vertical; min-height: 100px; font-family: var(--mono); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.checkline { display: flex; align-items: center; gap: 9px; font-size: 14px; }
.checkline input { width: auto; }

/* --------------------------------- login --------------------------------- */
.login-shell {
  min-height: 100vh; display: grid; place-items: center; padding: 28px 16px;
  background:
    radial-gradient(1000px 520px at 12% -10%, rgba(23, 105, 74, .16), transparent 60%),
    radial-gradient(760px 420px at 88% 8%, rgba(201, 162, 39, .16), transparent 55%),
    var(--bg);
}
.login-card { width: 100%; max-width: 420px; }
.login-brand { text-align: center; margin-bottom: 22px; }
.login-brand .mark {
  width: 62px; height: 62px; border-radius: 18px; margin: 0 auto 14px;
  background: linear-gradient(140deg, var(--green-700), var(--green-600));
  color: var(--gold-500); display: grid; place-items: center;
  font-weight: 800; font-size: 17px; letter-spacing: .01em;
  box-shadow: var(--shadow-md);
}
.login-brand h1 { font-size: 24px; }
.login-brand p { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

.segmented {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 18px;
}
.segmented button {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 13.5px;
  font-weight: 600; padding: 8px; border-radius: 7px;
  background: transparent; color: var(--muted);
}
.segmented button.on { background: var(--surface); color: var(--green-700); box-shadow: var(--shadow-sm); }

/* --------------------------------- alerts -------------------------------- */
.alert {
  border-radius: var(--radius-sm); padding: 11px 13px; font-size: 13.5px;
  display: flex; gap: 9px; align-items: flex-start; margin-bottom: 14px;
  border: 1px solid transparent;
}
.alert .ic { flex: none; font-weight: 700; }
.alert.error { background: var(--danger-bg); color: var(--danger); border-color: #f3cdc9; }
.alert.warn { background: var(--warn-bg); color: var(--warn); border-color: #f2dfae; }
.alert.ok { background: var(--ok-bg); color: var(--ok); border-color: #bdeacf; }
.alert.info { background: var(--info-bg); color: var(--info); border-color: #cddffb; }

#toasts {
  position: fixed; right: 16px; bottom: 16px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px; max-width: min(380px, 92vw);
}
.toast {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 4px solid var(--green-600);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  padding: 11px 14px; font-size: 13.5px; animation: slide .18s ease-out;
}
.toast.error { border-left-color: var(--danger); }
.toast.warn { border-left-color: var(--warn); }
@keyframes slide { from { opacity: 0; transform: translateY(8px); } }

/* --------------------------------- badges -------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 650; padding: 3px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
  white-space: nowrap;
}
.badge.green { background: var(--green-100); color: var(--green-700); border-color: transparent; }
.badge.gold { background: var(--gold-100); color: var(--gold-600); border-color: transparent; }
.badge.red { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.badge.grey { background: var(--surface-2); }
.meter { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; min-width: 80px; }
.meter > i { display: block; height: 100%; background: var(--green-600); border-radius: 4px; }
.meter.direct > i { background: var(--gold-500); }
.meter-row { display: flex; align-items: center; gap: 8px; }
.meter-row .meter { flex: 1; }
.meter-row .v { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.badge.new { background: var(--gold-100); color: var(--gold-600); border-color: transparent; font-weight: 700; }
.class-card .badge.new { margin-top: 6px; align-self: flex-start; }

/* --------------------------------- tables -------------------------------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--faint); font-weight: 700; background: var(--surface-2);
  position: sticky; top: 0; z-index: 2; white-space: nowrap;
}
tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ------------------------------ class cards ------------------------------ */
.card-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
}
.class-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; cursor: pointer; text-align: left; font: inherit; color: inherit;
  box-shadow: var(--shadow-sm); transition: transform .1s, box-shadow .12s, border-color .12s;
  display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden;
}
.class-card::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
  background: linear-gradient(var(--green-600), var(--gold-500));
}
.class-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
.class-card .code { font-size: 12px; font-weight: 700; color: var(--green-600); letter-spacing: .04em; }
.class-card .title { font-size: 15.5px; font-weight: 650; line-height: 1.3; }
.class-card .meta { font-size: 12.5px; color: var(--muted); }

/* ------------------------------- grade card ------------------------------ */
.grade-hero {
  display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center;
}
@media (max-width: 560px) { .grade-hero { grid-template-columns: 1fr; gap: 14px; } }
.grade-dial {
  width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--green-600) calc(var(--pct) * 1%), var(--border) 0);
  position: relative;
}
.grade-dial::after {
  content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--surface);
}
.grade-dial .inner { position: relative; z-index: 1; text-align: center; line-height: 1.1; }
.grade-dial .g { font-size: 30px; font-weight: 750; letter-spacing: -.02em; }
.grade-dial .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.stat-row { display: flex; flex-wrap: wrap; gap: 26px; }
.stat .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.stat .k { font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }

/* -------------------------------- gradebook ------------------------------ */
.gb-wrap { overflow: auto; max-height: 68vh; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table.gb { font-size: 13.5px; width: max-content; min-width: 100%; }
table.gb th, table.gb td { border-right: 1px solid var(--border); padding: 7px 9px; }
table.gb th.stick, table.gb td.stick {
  position: sticky; left: 0; z-index: 3; background: var(--surface);
  min-width: 208px; max-width: 208px;
}
table.gb th.stick { z-index: 5; background: var(--surface-2); }
table.gb tbody tr:hover td.stick { background: var(--surface-2); }
table.gb th.asm { width: 112px; min-width: 96px; vertical-align: bottom; cursor: pointer; }
/* Slack in a narrow gradebook goes to the trailing column, not into
   stretching every score column to three times the width it needs. */
table.gb th:last-child, table.gb td:last-child { width: 100%; min-width: 44px; }
table.gb th.asm:hover { background: var(--green-100); }
table.gb th .asm-name { font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 650; white-space: normal; line-height: 1.25; }
table.gb th .asm-sub { font-size: 10.5px; color: var(--faint); font-weight: 500; text-transform: none; letter-spacing: 0; }
table.gb input.score {
  width: 100%; padding: 5px 6px; font-size: 13.5px; text-align: right;
  border: 1px solid transparent; background: transparent; border-radius: 5px;
  font-variant-numeric: tabular-nums;
}
table.gb input.score:hover { border-color: var(--border-strong); }
table.gb input.score:focus { border-color: var(--green-600); background: var(--surface); box-shadow: 0 0 0 3px rgba(23,105,74,.14); }
table.gb input.score.dirty { background: var(--gold-100); border-color: var(--gold-500); }
table.gb td.total { font-weight: 700; background: var(--surface-2); }
.gb-name { font-weight: 600; }
.gb-id { font-size: 11.5px; color: var(--faint); font-family: var(--mono); }

.sticky-actions {
  position: sticky; bottom: 0; z-index: 20; margin-top: 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 11px 14px;
  display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-md);
}

/* --------------------------------- modal --------------------------------- */
.modal-back {
  position: fixed; inset: 0; z-index: 150; background: rgba(8, 30, 22, .48);
  display: grid; place-items: center; padding: 18px; overflow-y: auto;
  animation: fade .12s ease-out;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 520px; max-height: 92vh; display: flex; flex-direction: column;
  animation: pop .14s ease-out;
}
.modal.wide { max-width: 780px; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.modal header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.modal header h3 { font-size: 16px; }
.modal .body { padding: 20px; overflow-y: auto; }
.modal footer {
  padding: 14px 20px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
}

/* -------------------------------- spinner -------------------------------- */
.spinner {
  width: 16px; height: 16px; border-radius: 50%; flex: none;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 34px; justify-content: center; }

.empty { text-align: center; padding: 46px 20px; color: var(--muted); }
.empty .big { font-size: 34px; opacity: .35; margin-bottom: 8px; }
.empty h4 { font-size: 15px; margin-bottom: 6px; color: var(--text); }

/* Shown only on narrow screens, where the columns it summarises are hidden. */
.hide-lg { display: none; }
@media (max-width: 700px) { .hide-lg { display: block; } }

.progress { height: 7px; background: var(--border); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--green-600), var(--gold-500)); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

.copybox {
  display: flex; align-items: center; gap: 8px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px;
  font-family: var(--mono); font-size: 12.5px; word-break: break-all;
}

@media (max-width: 700px) {
  main { padding: 16px 12px 60px; }
  .card-body { padding: 14px; }

  .topbar { padding: 0 10px; gap: 8px; min-height: 56px; }
  .topbar .mark { width: 38px; height: 32px; font-size: 10px; }
  .topbar .brand { gap: 9px; }
  .topbar .t1 { font-size: 14px; white-space: nowrap; }
  .topbar .t2 { display: none; }
  .topbar .who { max-width: 104px; }
  .topbar .who .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .topbar .who .r { display: none; }
  .topbar .btn { padding: 6px 9px; font-size: 12px; white-space: nowrap; }

  .tabbar { top: 56px; }
  .hide-sm { display: none !important; }
  .stat-row { gap: 18px; }
  .stat .v { font-size: 19px; }
  .grade-dial { width: 108px; height: 108px; }
  .grade-dial .g { font-size: 25px; }
  .grade-dial .l { font-size: 9px; letter-spacing: .05em; }
}

/* ------------------------------ dashboards ------------------------------ */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 18px; }
.chart-box { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; background: var(--surface-2); min-width: 0; }
.chart-title { font-weight: 600; font-size: 13.5px; margin-bottom: 10px; }
.donut-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.donut { width: 140px; height: 140px; flex: none; }
.donut circle { transition: opacity .15s; }
.donut circle:hover { opacity: .8; }
.donut-big { font-size: 26px; font-weight: 700; fill: var(--text); }
.donut-small { font-size: 11px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.donut-wrap .legend { flex-direction: column; flex: 1; min-width: 120px; margin: 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend b { color: var(--text); font-variant-numeric: tabular-nums; }
.cols { padding-top: 16px; }
.cols-plot { position: relative; height: 170px; display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--border-strong); }
.cols-grid i { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
.cols-target { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--danger); opacity: .7; z-index: 1; pointer-events: none; }
