name: Build APK

# Every push builds a test APK (app ID ph.edu.mmsu.ee.grades.debug), downloadable
# from the run's Artifacts.
# Pushing a tag like v1.2.0 builds the real app, signed with the permanent key
# from the repository secrets, and publishes it as a GitHub Release. The newest
# release is always at:
#   https://github.com/KinDar29/ee-grades-android/releases/latest/download/ee-grades.apk

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---------------------------- test builds ----------------------------
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace ${{ vars.EE_API_URL && format('-PEE_API_URL={0}', vars.EE_API_URL) || '' }}

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ee-grades-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------ releases ------------------------------
      - name: Check the tag matches versionName
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $have in app/build.gradle.kts"
            exit 1
          fi

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          EE_KEYSTORE_BASE64: ${{ secrets.EE_KEYSTORE_BASE64 }}
          EE_KEYSTORE_PASSWORD: ${{ secrets.EE_KEYSTORE_PASSWORD }}
          EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
        run: |
          if [ -z "$EE_KEYSTORE_BASE64" ] || [ -z "$EE_KEYSTORE_PASSWORD" ] || [ -z "$EE_KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Add EE_KEYSTORE_BASE64, EE_KEYSTORE_PASSWORD and EE_KEY_ALIAS under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$EE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export EE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace ${{ vars.EE_API_URL && format('-PEE_API_URL={0}', vars.EE_API_URL) || '' }}
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ee-grades.apk"

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/ee-grades.apk" \
            --title "EE Grades $GITHUB_REF_NAME" --generate-notes
